[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 26
learning_rate = 0.1
n_estimators = 100
min_child_weight = 6
subsample = 0.7799973899578304
colsample_bytree = 0.8130027132993314
gamma = 0.10552266917523435
reg_lambda = 3.817552597965877

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0036712594218006713
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
