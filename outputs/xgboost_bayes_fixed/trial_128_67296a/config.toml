[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 4
learning_rate = 0.1
n_estimators = 100
min_child_weight = 1
subsample = 0.665382397190201
colsample_bytree = 0.7970285957463056
gamma = 0.0029107375966544633
reg_lambda = 2.149893199498947

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.019253930945941865
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
