[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 187
d_model = 208
d_state = 17
d_conv = 3
expand = 2
num_layers = 2
dropout = 0.12380760925021618
n_layers = 9

[training]
max_epochs = 150
batch_size = 314
learning_rate = 0.0007549607674062255
weight_decay = 0.0003685832169525436
