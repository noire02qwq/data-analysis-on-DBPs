[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 139
d_model = 70
n_layers = 5
d_state = 55
d_conv = 4
expand = 3
dropout = 0.41121082306951134

[training]
max_epochs = 150
batch_size = 245
learning_rate = 0.001855043107831352
weight_decay = 0.00010223838706990676
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
