[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 161
d_model = 318
n_layers = 8
d_state = 51
d_conv = 8
expand = 2
dropout = 0.10317486701904038

[training]
max_epochs = 150
batch_size = 181
learning_rate = 0.0011933284613258534
weight_decay = 0.00013430127217310616
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
