[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 161
d_model = 500
n_layers = 7
d_state = 52
d_conv = 8
expand = 4
dropout = 0.18510760878954233

[training]
max_epochs = 150
batch_size = 285
learning_rate = 0.0014889011773611535
weight_decay = 0.0016664932632375609
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
