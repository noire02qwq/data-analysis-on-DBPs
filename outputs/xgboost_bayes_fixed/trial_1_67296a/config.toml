[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 20
learning_rate = 0.1
n_estimators = 100
min_child_weight = 9
subsample = 0.7302761868971932
colsample_bytree = 0.7013477419934502
gamma = 0.008020827926958693
reg_lambda = 4.9987822391728916

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.00617012573686435
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
