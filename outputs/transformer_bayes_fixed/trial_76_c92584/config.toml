[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 146
d_model = 110
nhead = 4
num_encoder_layers = 2
dim_feedforward = 575
dropout = 0.25430909682798086

[training]
max_epochs = 150
batch_size = 127
learning_rate = 0.001568631029772736
weight_decay = 0.00016280355307360289
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
