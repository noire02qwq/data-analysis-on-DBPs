[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 4
learning_rate = 0.1
n_estimators = 100
min_child_weight = 1
subsample = 0.6652020449820121
colsample_bytree = 0.7633224527132515
gamma = 0.004537405939304657
reg_lambda = 2.311861161785482

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.012096313062475642
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
