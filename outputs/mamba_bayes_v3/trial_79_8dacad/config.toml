[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 180
d_model = 509
n_layers = 10
d_state = 45
d_conv = 7
expand = 3
dropout = 0.15213119282101623
batch_size = 184
learning_rate = 0.0011009464209739877
weight_decay = 0.0029469184062800744

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
