[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 174
d_model = 274
d_state = 23
d_conv = 4
expand = 2
num_layers = 2
dropout = 0.23555301912544951
n_layers = 6

[training]
max_epochs = 150
batch_size = 234
learning_rate = 0.0012085665790273895
weight_decay = 0.0002498459437984294
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
