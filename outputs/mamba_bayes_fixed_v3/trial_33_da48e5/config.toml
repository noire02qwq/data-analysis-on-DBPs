[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 178
d_model = 255
n_layers = 4
d_state = 59
d_conv = 5
expand = 3
dropout = 0.29345173859087453

[training]
max_epochs = 150
batch_size = 316
learning_rate = 0.0008771240108325721
weight_decay = 0.0018465851669049803
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
