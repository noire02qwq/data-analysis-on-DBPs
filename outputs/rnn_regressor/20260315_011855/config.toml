[model]
type = "RNN"
name = "rnn_regressor"
history_length = 49
units = 240
num_layers = 4
dropout = 0.32368334158305995

[training]
max_epochs = 10
batch_size = 112
learning_rate = 0.003241985527480183
weight_decay = 0.00018913327764896986
patience = 5
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
]
