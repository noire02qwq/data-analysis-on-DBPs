[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 166
d_model = 137
d_state = 9
d_conv = 8
expand = 2
num_layers = 2
dropout = 0.145182782029396
n_layers = 5

[training]
max_epochs = 150
batch_size = 233
learning_rate = 0.001604984335549852
weight_decay = 0.00015486648009542915
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
