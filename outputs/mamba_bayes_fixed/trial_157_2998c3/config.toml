[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 181
d_model = 111
d_state = 16
d_conv = 7
expand = 3
num_layers = 2
dropout = 0.36847221323033447
n_layers = 7

[training]
max_epochs = 150
batch_size = 258
learning_rate = 0.0014287049543140857
