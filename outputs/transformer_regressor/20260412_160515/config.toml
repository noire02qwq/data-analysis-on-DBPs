[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 159
d_model = 240
nhead = 8
num_encoder_layers = 2
dim_feedforward = 936
dropout = 0.10145736230276543

[training]
max_epochs = 150
batch_size = 195
learning_rate = 0.0001185338607782186
weight_decay = 1.5115040250925528e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
