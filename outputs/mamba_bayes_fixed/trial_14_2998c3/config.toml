[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 70
d_model = 313
d_state = 27
d_conv = 6
expand = 2
num_layers = 2
dropout = 0.3601723383274343
n_layers = 8

[training]
max_epochs = 150
batch_size = 210
learning_rate = 0.0013775235400880664
weight_decay = 0.0019873796648937894
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
