[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 122
d_model = 79
nhead = 16
num_encoder_layers = 5
dim_feedforward = 293
dropout = 0.12988099396834157

[training]
max_epochs = 150
batch_size = 128
learning_rate = 0.0007286251145857972
weight_decay = 0.00020460703018746056
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
