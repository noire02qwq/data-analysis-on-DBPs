[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 140
d_model = 369
n_layers = 6
d_state = 22
d_conv = 7
expand = 3
dropout = 0.26333769430136905

[training]
max_epochs = 150
batch_size = 327
learning_rate = 0.00040482001814712347
weight_decay = 0.00011927459439718488
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
