[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 6
learning_rate = 0.1
n_estimators = 100
min_child_weight = 1
subsample = 0.6479876481550226
colsample_bytree = 0.7566073572923065
gamma = 0.003711326089155444
reg_lambda = 2.536856428317171

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.013163696210065001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
