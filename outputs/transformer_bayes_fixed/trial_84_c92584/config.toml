[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 70
d_model = 171
nhead = 8
num_encoder_layers = 5
dim_feedforward = 522
dropout = 0.07307627842540361

[training]
max_epochs = 150
batch_size = 147
learning_rate = 0.0009793111928285958
weight_decay = 7.711140616961826e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
