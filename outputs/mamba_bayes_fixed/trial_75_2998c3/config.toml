[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 47
d_model = 248
d_state = 25
d_conv = 2
expand = 2
num_layers = 2
dropout = 0.16204341794756888
n_layers = 10

[training]
max_epochs = 150
batch_size = 272
learning_rate = 0.0015305915538253848
weight_decay = 0.0003689639655282982
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
