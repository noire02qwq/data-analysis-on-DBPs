[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 111
d_model = 183
n_layers = 9
d_state = 18
d_conv = 6
expand = 4
dropout = 0.37248355595991833

[training]
max_epochs = 150
batch_size = 339
learning_rate = 0.00046217958859189534
weight_decay = 0.0013134008540139244
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
