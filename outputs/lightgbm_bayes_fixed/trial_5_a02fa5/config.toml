[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 12
learning_rate = 0.1
n_estimators = 100
min_child_samples = 66
subsample = 0.7594556398137118
colsample_bytree = 0.8363826998831918
reg_alpha = 0.11888422572233485
reg_lambda = 3.2721626994478905

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.01750661180957776
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
