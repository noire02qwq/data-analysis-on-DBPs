[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 119
d_model = 203
nhead = 8
num_encoder_layers = 5
dim_feedforward = 829
dropout = 0.1325350505936602

[training]
max_epochs = 150
batch_size = 247
learning_rate = 0.0002018530896528315
weight_decay = 0.0005871885772229639
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
