[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 101
d_model = 182
d_state = 14
d_conv = 6
expand = 2
num_layers = 2
dropout = 0.31843533162762666
n_layers = 12

[training]
max_epochs = 150
batch_size = 220
learning_rate = 0.0011151303333928018
weight_decay = 0.00029100851266200875
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
