[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 187
d_model = 428
n_layers = 7
d_state = 31
d_conv = 4
expand = 3
dropout = 0.30210382781825684

[training]
max_epochs = 150
batch_size = 232
learning_rate = 0.001295687242103197
weight_decay = 0.0008513609717117036
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
