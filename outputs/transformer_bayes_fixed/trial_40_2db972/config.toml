[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 40
d_model = 88
nhead = 4
num_encoder_layers = 5
dim_feedforward = 753
dropout = 0.1192116723275064

[training]
max_epochs = 150
batch_size = 195
learning_rate = 0.0014448308759980601
weight_decay = 0.006261032153241136
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
