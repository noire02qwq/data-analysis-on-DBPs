[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 52
d_model = 366
n_layers = 5
d_state = 19
d_conv = 4
expand = 3
dropout = 0.20201790899612374

[training]
max_epochs = 150
batch_size = 324
learning_rate = 0.00081129284488298
weight_decay = 0.0012680806659117602
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
