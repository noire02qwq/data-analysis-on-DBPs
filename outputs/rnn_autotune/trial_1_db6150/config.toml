[model]
type = "RNN"
name = "rnn_regressor"
history_length = 28
units = 185
num_layers = 3
dropout = 0.15089540702554877

[training]
max_epochs = 10
batch_size = 244
learning_rate = 0.006908733446602026
weight_decay = 0.0013811782034046113
patience = 5
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
]
