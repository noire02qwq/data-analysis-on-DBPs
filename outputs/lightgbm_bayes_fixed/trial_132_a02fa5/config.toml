[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 4
learning_rate = 0.1
n_estimators = 100
min_child_samples = 65
subsample = 0.7478217284249725
colsample_bytree = 0.8337803701747849
reg_alpha = 0.030041358871062872
reg_lambda = 1.7080539143028926

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.007010557917244023
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
