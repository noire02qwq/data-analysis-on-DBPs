[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 21
learning_rate = 0.1
n_estimators = 100
min_child_samples = 74
subsample = 0.8654921226003062
colsample_bytree = 0.7520158473002833
reg_alpha = 0.0037566158137316732
reg_lambda = 0.5917783599602348

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.012131002739694629
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
