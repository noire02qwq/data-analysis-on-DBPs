[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 136
d_model = 399
n_layers = 11
d_state = 53
d_conv = 5
expand = 3
dropout = 0.43249181174607915
batch_size = 143
learning_rate = 0.0005814200422508614
weight_decay = 0.003149429905272654

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
