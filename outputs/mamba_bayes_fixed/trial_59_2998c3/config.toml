[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 187
d_model = 413
d_state = 23
d_conv = 4
expand = 3
num_layers = 2
dropout = 0.10958219351219896
n_layers = 6

[training]
max_epochs = 150
batch_size = 365
learning_rate = 0.0007832639819505565
