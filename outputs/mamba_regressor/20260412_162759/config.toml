[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 129
d_model = 156
n_layers = 2
d_state = 26
d_conv = 5
expand = 2
dropout = 0.40060038780764184

[training]
max_epochs = 150
batch_size = 194
learning_rate = 0.0011658068450458368
weight_decay = 0.0002316288834633235
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
