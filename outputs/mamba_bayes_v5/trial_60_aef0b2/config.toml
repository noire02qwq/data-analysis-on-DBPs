[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 151
d_model = 251
n_layers = 4
d_state = 25
d_conv = 5
expand = 2
dropout = 0.47006681568852643

[training]
max_epochs = 150
batch_size = 372
learning_rate = 0.0009392706613822771
weight_decay = 0.009200013498088177
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
