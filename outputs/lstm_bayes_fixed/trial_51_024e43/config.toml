[model]
type = "LSTM"
name = "lstm_regressor"
history_length = 74
units = 230
num_layers = 1
dropout = 0.15779281036871798

[training]
max_epochs = 150
batch_size = 231
learning_rate = 0.0005907119291812556
weight_decay = 0.0001370427460092242
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
