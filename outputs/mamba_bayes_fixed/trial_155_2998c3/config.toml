[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 77
d_model = 276
d_state = 62
d_conv = 6
expand = 2
num_layers = 2
dropout = 0.22405547051923805
n_layers = 8

[training]
max_epochs = 150
batch_size = 227
learning_rate = 0.001683573913104637
weight_decay = 0.00022466501550275563
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
