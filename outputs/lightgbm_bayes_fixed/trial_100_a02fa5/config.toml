[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 16
learning_rate = 0.1
n_estimators = 100
min_child_samples = 55
subsample = 0.7432097118129117
colsample_bytree = 0.8120943695226526
reg_alpha = 0.002251064751692579
reg_lambda = 4.266643590673553

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0076596063938210585
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
