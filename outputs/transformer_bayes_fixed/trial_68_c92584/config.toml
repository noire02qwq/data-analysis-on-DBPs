[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 76
d_model = 165
nhead = 8
num_encoder_layers = 5
dim_feedforward = 442
dropout = 0.13704996990739246

[training]
max_epochs = 150
batch_size = 133
learning_rate = 0.00010648171014659146
weight_decay = 0.000776073722111746
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
