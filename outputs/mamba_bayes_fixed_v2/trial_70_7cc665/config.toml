[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 90
d_model = 106
n_layers = 2
d_state = 39
d_conv = 3
expand = 3
dropout = 0.222958810584833

[training]
max_epochs = 150
batch_size = 289
learning_rate = 0.0006079349787680289
weight_decay = 0.0001808453677871247
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
