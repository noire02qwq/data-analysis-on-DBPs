[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 135
d_model = 421
d_state = 10
d_conv = 4
expand = 2
num_layers = 2
dropout = 0.20833116888785647
n_layers = 4

[training]
max_epochs = 150
batch_size = 264
learning_rate = 0.0013580060548393333
weight_decay = 0.0002689082792651991
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
