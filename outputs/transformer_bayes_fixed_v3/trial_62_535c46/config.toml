[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 82
d_model = 249
nhead = 4
num_encoder_layers = 2
dim_feedforward = 542
dropout = 0.09043249624965922

[training]
max_epochs = 150
batch_size = 170
learning_rate = 0.0017017581525423464
weight_decay = 0.002762547777316527
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
