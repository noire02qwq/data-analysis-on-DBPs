[model]
type = "RNN"
name = "rnn_regressor"
history_length = 47
units = 86
num_layers = 2
dropout = 0.22271526803894648

[training]
max_epochs = 10
batch_size = 153
learning_rate = 0.0007931485443971335
weight_decay = 0.00890276861923012
patience = 5
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
]
