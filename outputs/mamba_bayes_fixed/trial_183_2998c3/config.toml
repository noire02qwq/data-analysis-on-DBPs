[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 189
d_model = 428
d_state = 20
d_conv = 2
expand = 2
num_layers = 2
dropout = 0.19775462538722932
n_layers = 7

[training]
max_epochs = 150
batch_size = 278
learning_rate = 0.0012877999816346213
weight_decay = 0.0003582329510056897
