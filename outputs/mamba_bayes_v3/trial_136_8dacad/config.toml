[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 131
d_model = 484
n_layers = 5
d_state = 54
d_conv = 7
expand = 3
dropout = 0.3816279873385894
batch_size = 280
learning_rate = 0.00045546677505096684
weight_decay = 0.005044775824447311

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
