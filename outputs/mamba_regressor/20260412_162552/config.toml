[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 112
d_model = 280
n_layers = 7
d_state = 19
d_conv = 8
expand = 2
dropout = 0.371135783166828

[training]
max_epochs = 150
batch_size = 375
learning_rate = 0.0012256503498031806
weight_decay = 0.00019961493699794877
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
