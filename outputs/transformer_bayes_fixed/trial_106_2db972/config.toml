[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 38
d_model = 111
nhead = 16
num_encoder_layers = 4
dim_feedforward = 959
dropout = 0.094731244374144

[training]
max_epochs = 150
batch_size = 193
learning_rate = 0.00010564912729922187
weight_decay = 0.002862177629141443
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
