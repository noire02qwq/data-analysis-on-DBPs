[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 150
d_model = 183
n_layers = 5
d_state = 8
d_conv = 8
expand = 2
dropout = 0.13241587435909677
batch_size = 150
learning_rate = 0.0019880155213748262
weight_decay = 0.008427376009841179

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
