[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 117
d_model = 141
n_layers = 6
d_state = 26
d_conv = 5
expand = 3
dropout = 0.462012994907615

[training]
max_epochs = 150
batch_size = 358
learning_rate = 0.0014235382193476974
weight_decay = 0.0036096193025019012
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
