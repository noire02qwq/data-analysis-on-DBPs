[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 190
d_model = 509
n_layers = 6
d_state = 46
d_conv = 6
expand = 4
dropout = 0.4738997957602517

[training]
max_epochs = 150
batch_size = 379
learning_rate = 0.0019782661896944284
weight_decay = 0.006021072140456726
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
