[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 136
d_model = 220
nhead = 8
num_encoder_layers = 2
dim_feedforward = 932
dropout = 0.09602773617555177

[training]
max_epochs = 150
batch_size = 215
learning_rate = 0.00011464156191373543
weight_decay = 1.8039695722931256e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
