[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 42
d_model = 219
n_layers = 4
d_state = 39
d_conv = 5
expand = 3
dropout = 0.23453218558702996

[training]
max_epochs = 150
batch_size = 207
learning_rate = 0.0009415233971218636
weight_decay = 0.005299546483287928
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
