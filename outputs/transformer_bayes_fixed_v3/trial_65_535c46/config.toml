[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 110
d_model = 240
nhead = 4
num_encoder_layers = 3
dim_feedforward = 511
dropout = 0.22361485813334567

[training]
max_epochs = 150
batch_size = 198
learning_rate = 0.0007186834732684214
weight_decay = 0.007768750266106921
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
