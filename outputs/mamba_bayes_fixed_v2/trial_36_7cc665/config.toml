[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 86
d_model = 278
n_layers = 3
d_state = 8
d_conv = 4
expand = 2
dropout = 0.21376174834706405

[training]
max_epochs = 150
batch_size = 286
learning_rate = 0.0007850088566957826
weight_decay = 0.007783026249631374
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
