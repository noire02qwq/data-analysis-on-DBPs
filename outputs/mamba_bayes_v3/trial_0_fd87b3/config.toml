[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 33
d_model = 91
n_layers = 3
d_state = 47
d_conv = 6
expand = 2
dropout = 0.4471176669729361
batch_size = 228
learning_rate = 0.0016317496742473516
weight_decay = 0.00034854472016920563

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
