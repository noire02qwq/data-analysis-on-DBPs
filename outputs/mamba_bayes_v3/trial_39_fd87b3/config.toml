[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 172
d_model = 389
n_layers = 12
d_state = 52
d_conv = 2
expand = 4
dropout = 0.17112712007777994
batch_size = 239
learning_rate = 0.0008638084921022372
weight_decay = 0.0008991093725818802

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
