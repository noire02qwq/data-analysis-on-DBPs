[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 167
d_model = 418
n_layers = 3
d_state = 48
d_conv = 8
expand = 4
dropout = 0.4148798210892858
batch_size = 165
learning_rate = 0.0005551417739059618
weight_decay = 0.008592491958733765

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
