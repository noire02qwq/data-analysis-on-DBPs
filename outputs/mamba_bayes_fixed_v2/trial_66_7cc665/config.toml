[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 48
d_model = 259
n_layers = 8
d_state = 50
d_conv = 3
expand = 3
dropout = 0.35464059647495627

[training]
max_epochs = 150
batch_size = 383
learning_rate = 0.0005472784615231824
weight_decay = 0.0031539383144534496
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
