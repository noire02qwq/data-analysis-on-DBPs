[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 44
d_model = 73
nhead = 8
num_encoder_layers = 2
dim_feedforward = 833
dropout = 0.27303231198359657

[training]
max_epochs = 150
batch_size = 192
learning_rate = 0.0004923126219191817
weight_decay = 0.0002757652630639418
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
