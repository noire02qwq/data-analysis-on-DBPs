[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 160
d_model = 103
d_state = 23
d_conv = 2
expand = 2
num_layers = 2
dropout = 0.23442472187935742
n_layers = 11

[training]
max_epochs = 150
batch_size = 193
learning_rate = 0.0013664289554667839
weight_decay = 0.00041651373527264174
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
