[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 55
d_model = 485
n_layers = 2
d_state = 34
d_conv = 4
expand = 3
dropout = 0.3252601016791378

[training]
max_epochs = 150
batch_size = 309
learning_rate = 0.0012251038356710672
weight_decay = 0.008179396103137029
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
