[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 136
d_model = 226
nhead = 8
num_encoder_layers = 2
dim_feedforward = 706
dropout = 0.0826790229726281

[training]
max_epochs = 150
batch_size = 161
learning_rate = 0.00011554162351785165
weight_decay = 0.0009202842931859649
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
