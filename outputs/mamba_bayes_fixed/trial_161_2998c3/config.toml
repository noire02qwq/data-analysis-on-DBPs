[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 177
d_model = 122
d_state = 20
d_conv = 4
expand = 4
num_layers = 2
dropout = 0.26084954561285517
n_layers = 7

[training]
max_epochs = 150
batch_size = 317
learning_rate = 0.0018340424317429853
weight_decay = 0.00032130218493601077
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
