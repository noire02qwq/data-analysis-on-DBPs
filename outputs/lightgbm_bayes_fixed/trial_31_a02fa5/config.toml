[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 6
learning_rate = 0.1
n_estimators = 100
min_child_samples = 91
subsample = 0.7389284881523905
colsample_bytree = 0.8141917977099328
reg_alpha = 0.19552589826275615
reg_lambda = 2.3076900965751306

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0032671013314521094
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
