[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 115
d_model = 307
n_layers = 5
d_state = 18
d_conv = 5
expand = 2
dropout = 0.10356522522204915

[training]
max_epochs = 150
batch_size = 377
learning_rate = 0.0016050109914884452
weight_decay = 0.00011483703257290563
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
