[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 137
d_model = 435
n_layers = 4
d_state = 50
d_conv = 7
expand = 3
dropout = 0.39112641635545276
batch_size = 145
learning_rate = 0.000531140286269736
weight_decay = 0.004075972158573787

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
