[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 44
d_model = 343
d_state = 18
d_conv = 7
expand = 3
num_layers = 2
dropout = 0.4222611273777605
n_layers = 11

[training]
max_epochs = 150
batch_size = 246
learning_rate = 0.0008890702376938637
weight_decay = 0.004299897250453752
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
