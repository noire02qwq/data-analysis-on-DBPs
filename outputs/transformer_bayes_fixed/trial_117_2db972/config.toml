[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 93
d_model = 236
nhead = 4
num_encoder_layers = 6
dim_feedforward = 540
dropout = 0.11286581469824476

[training]
max_epochs = 150
batch_size = 183
learning_rate = 0.0007162771688988205
weight_decay = 0.0011617982643801691
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
