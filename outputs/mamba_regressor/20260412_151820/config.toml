[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 119
d_model = 73
n_layers = 12
d_state = 34
d_conv = 3
expand = 2
dropout = 0.499811225394828

[training]
max_epochs = 150
batch_size = 378
learning_rate = 0.0007160216465750637
weight_decay = 0.0024144862411165885
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
