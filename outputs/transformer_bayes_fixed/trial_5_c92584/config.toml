[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 66
d_model = 246
nhead = 4
num_encoder_layers = 6
dim_feedforward = 872
dropout = 0.0851566910310824

[training]
max_epochs = 150
batch_size = 150
learning_rate = 0.002293409471140733
weight_decay = 0.005841783103334531
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
