[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 156
d_model = 240
nhead = 16
num_encoder_layers = 2
dim_feedforward = 701
dropout = 0.09242032660814525

[training]
max_epochs = 150
batch_size = 152
learning_rate = 0.0001005007813043011
weight_decay = 1.8392321349467936e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
