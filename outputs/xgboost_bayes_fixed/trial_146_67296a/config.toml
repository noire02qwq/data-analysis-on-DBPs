[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 12
learning_rate = 0.1
n_estimators = 100
min_child_weight = 1
subsample = 0.6742127436831744
colsample_bytree = 0.8044853170914918
gamma = 0.0012369688072032706
reg_lambda = 2.6531631800732605

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.016015352458592154
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
