[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 116
d_model = 75
nhead = 8
num_encoder_layers = 3
dim_feedforward = 517
dropout = 0.18615740153985064

[training]
max_epochs = 150
batch_size = 128
learning_rate = 0.00268795389030621
weight_decay = 0.002239313187905472
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
