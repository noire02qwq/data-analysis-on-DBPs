[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 24
learning_rate = 0.1
n_estimators = 100
min_child_weight = 7
subsample = 0.6060858767972119
colsample_bytree = 0.620457200099933
gamma = 0.039680145400107156
reg_lambda = 4.8922625692617325

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.00213978752816455
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
