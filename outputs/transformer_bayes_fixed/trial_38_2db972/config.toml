[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 108
d_model = 75
nhead = 4
num_encoder_layers = 4
dim_feedforward = 336
dropout = 0.0963918254532023

[training]
max_epochs = 150
batch_size = 162
learning_rate = 0.000631251603200553
weight_decay = 0.002041728946738199
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
