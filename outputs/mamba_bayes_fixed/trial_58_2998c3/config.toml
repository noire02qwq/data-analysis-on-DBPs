[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 127
d_model = 245
d_state = 26
d_conv = 8
expand = 2
num_layers = 2
dropout = 0.24353584459144026
n_layers = 5

[training]
max_epochs = 150
batch_size = 243
learning_rate = 0.0018240720717487486
weight_decay = 0.000813761946141744
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
