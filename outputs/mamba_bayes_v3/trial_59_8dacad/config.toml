[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 165
d_model = 306
n_layers = 5
d_state = 51
d_conv = 4
expand = 2
dropout = 0.19791973841340674
batch_size = 174
learning_rate = 0.0007183606429446875
weight_decay = 0.0014072745924304172

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
