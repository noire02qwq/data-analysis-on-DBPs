[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 7
learning_rate = 0.1
n_estimators = 100
min_child_samples = 53
subsample = 0.8299789796706056
colsample_bytree = 0.9216659327356949
reg_alpha = 0.0173160841497535
reg_lambda = 3.3411726357056217

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0026052305834125167
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
