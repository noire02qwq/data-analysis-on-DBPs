[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 139
d_model = 175
nhead = 4
num_encoder_layers = 2
dim_feedforward = 913
dropout = 0.0873278539385585

[training]
max_epochs = 150
batch_size = 175
learning_rate = 0.001183975566032264
weight_decay = 0.0008997542844894154
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
