[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 28
learning_rate = 0.1
n_estimators = 100
min_child_weight = 1
subsample = 0.8485058219723346
colsample_bytree = 0.7342540516542702
gamma = 0.0010585798891264715
reg_lambda = 0.8761542273307789

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.006773833351864301
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
