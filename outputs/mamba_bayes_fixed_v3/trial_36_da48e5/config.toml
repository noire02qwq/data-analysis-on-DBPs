[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 131
d_model = 434
n_layers = 6
d_state = 8
d_conv = 4
expand = 3
dropout = 0.18018347010048824

[training]
max_epochs = 150
batch_size = 253
learning_rate = 0.001789436487999495
weight_decay = 0.007484325332356725
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
