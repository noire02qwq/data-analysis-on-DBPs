[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 12
learning_rate = 0.1
n_estimators = 100
min_child_weight = 2
subsample = 0.9598436515923294
colsample_bytree = 0.9705649760995199
gamma = 1.1716033833540658
reg_lambda = 4.137370998866477

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.006021897482062663
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
