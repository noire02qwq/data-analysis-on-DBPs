[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 120
d_model = 283
n_layers = 6
d_state = 16
d_conv = 4
expand = 3
dropout = 0.32198867098845807

[training]
max_epochs = 150
batch_size = 381
learning_rate = 0.0013807998120339822
weight_decay = 0.00016032224853634834
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
