[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 185
d_model = 253
n_layers = 10
d_state = 39
d_conv = 7
expand = 4
dropout = 0.1810452796922865
batch_size = 128
learning_rate = 0.000402679903539582
weight_decay = 0.002323513836393272

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
