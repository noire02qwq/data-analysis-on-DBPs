[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 120
d_model = 119
nhead = 4
num_encoder_layers = 5
dim_feedforward = 705
dropout = 0.1201345914464221

[training]
max_epochs = 150
batch_size = 137
learning_rate = 0.0002765404175133106
weight_decay = 0.003470719448151651
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
