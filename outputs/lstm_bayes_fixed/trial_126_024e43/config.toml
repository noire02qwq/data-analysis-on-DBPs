[model]
type = "LSTM"
name = "lstm_regressor"
history_length = 119
units = 341
num_layers = 1
dropout = 0.49690696187296945

[training]
max_epochs = 150
batch_size = 373
learning_rate = 0.0002551422050985748
weight_decay = 0.0001020367058746544
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
