[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 191
d_model = 139
n_layers = 4
d_state = 64
d_conv = 6
expand = 4
dropout = 0.3442606260010696

[training]
max_epochs = 150
batch_size = 290
learning_rate = 0.0013655301223551514
weight_decay = 0.005310518687527876
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
