[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 116
d_model = 335
d_state = 12
d_conv = 4
expand = 2
num_layers = 2
dropout = 0.2181426778023633
n_layers = 7

[training]
max_epochs = 150
batch_size = 296
learning_rate = 0.001054336066874091
weight_decay = 0.0002299818207386869
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
