[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 52
d_model = 479
n_layers = 3
d_state = 12
d_conv = 3
expand = 3
dropout = 0.2554502935411336

[training]
max_epochs = 150
batch_size = 295
learning_rate = 0.0014690514967229445
weight_decay = 0.00024662973432044614
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
