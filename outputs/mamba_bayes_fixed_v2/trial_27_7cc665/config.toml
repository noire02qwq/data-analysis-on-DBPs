[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 96
d_model = 398
n_layers = 4
d_state = 34
d_conv = 4
expand = 2
dropout = 0.29611183953305703

[training]
max_epochs = 150
batch_size = 172
learning_rate = 0.0013799388492906728
weight_decay = 0.005944655530964938
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
