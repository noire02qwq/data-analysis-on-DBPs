[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 54
d_model = 239
nhead = 16
num_encoder_layers = 4
dim_feedforward = 438
dropout = 0.07873351678111647

[training]
max_epochs = 150
batch_size = 256
learning_rate = 0.00036563938563440344
weight_decay = 0.00013058935883883781
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
