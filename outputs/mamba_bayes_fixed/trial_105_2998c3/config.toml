[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 145
d_model = 349
d_state = 25
d_conv = 4
expand = 2
num_layers = 2
dropout = 0.23859987654471443
n_layers = 6

[training]
max_epochs = 150
batch_size = 286
learning_rate = 0.000914564852457413
weight_decay = 0.00028467187498027623
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
