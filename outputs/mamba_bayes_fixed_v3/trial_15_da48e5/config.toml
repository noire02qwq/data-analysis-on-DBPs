[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 134
d_model = 223
n_layers = 11
d_state = 38
d_conv = 8
expand = 4
dropout = 0.3655215426693255

[training]
max_epochs = 150
batch_size = 170
learning_rate = 0.0006263127439143424
weight_decay = 0.000250708430940532
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
