[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 48
d_model = 494
n_layers = 8
d_state = 8
d_conv = 2
expand = 3
dropout = 0.10504115582863398

[training]
max_epochs = 150
batch_size = 330
learning_rate = 0.0009996551783705333
weight_decay = 0.008729229169285441
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
