[model]
type = "CATBOOST"
name = "catboost_regressor"
depth = 7
learning_rate = 0.05
l2_leaf_reg = 2.3073103681446767
subsample = 0.9547155766655279
random_strength = 0.43099400222187223
bagging_temperature = 0.0032299981974883356

[training]
max_epochs = 300
batch_size = 256
learning_rate = 0.0024319214644269237
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
