[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 177
d_model = 302
d_state = 13
d_conv = 5
expand = 2
num_layers = 2
dropout = 0.24200804277247281
n_layers = 12

[training]
max_epochs = 150
batch_size = 325
learning_rate = 0.0010541674463644902
