[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 85
d_model = 101
nhead = 4
num_encoder_layers = 4
dim_feedforward = 382
dropout = 0.2829657450896437

[training]
max_epochs = 150
batch_size = 129
learning_rate = 0.00034499365785458253
weight_decay = 0.0006319424853532973
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
