[model]
type = "LSTM"
name = "lstm_regressor"
history_length = 91
units = 333
dropout = 0.11439303395937786
batch_size = 277
learning_rate = 0.00024251752636992904
weight_decay = 0.0001579350909442987

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
