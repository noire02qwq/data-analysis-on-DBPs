[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 167
d_model = 319
n_layers = 7
d_state = 64
d_conv = 6
expand = 3
dropout = 0.25696879155313673
batch_size = 169
learning_rate = 0.0011760047658201792
weight_decay = 0.000510401773589042

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
