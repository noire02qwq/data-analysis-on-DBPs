[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 14
learning_rate = 0.1
n_estimators = 100
min_child_samples = 37
subsample = 0.6357196516845828
colsample_bytree = 0.826969148239495
reg_alpha = 0.002742970145946271
reg_lambda = 3.5987855278767453

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0024804439825619824
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
