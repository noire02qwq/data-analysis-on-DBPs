[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 11
learning_rate = 0.1
n_estimators = 100
min_child_samples = 82
subsample = 0.7196443634721751
colsample_bytree = 0.8141499977550768
reg_alpha = 0.6791698591050281
reg_lambda = 0.7905688932439413

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.00493531109762842
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
