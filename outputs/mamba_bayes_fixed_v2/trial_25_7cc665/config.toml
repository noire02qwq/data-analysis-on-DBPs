[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 122
d_model = 173
n_layers = 8
d_state = 26
d_conv = 3
expand = 3
dropout = 0.23275661603437117

[training]
max_epochs = 150
batch_size = 331
learning_rate = 0.0010338488718751224
weight_decay = 0.001045961270832548
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
