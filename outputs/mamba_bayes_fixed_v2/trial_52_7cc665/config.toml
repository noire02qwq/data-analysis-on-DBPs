[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 130
d_model = 333
n_layers = 10
d_state = 10
d_conv = 8
expand = 3
dropout = 0.30869024933152894

[training]
max_epochs = 150
batch_size = 200
learning_rate = 0.001391160039803736
weight_decay = 0.0019323110637515179
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
