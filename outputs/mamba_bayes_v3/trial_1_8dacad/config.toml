[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 95
d_model = 360
n_layers = 2
d_state = 60
d_conv = 4
expand = 4
dropout = 0.49589891469654024
batch_size = 235
learning_rate = 0.0009856686520352334
weight_decay = 0.00036324877376384704

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
