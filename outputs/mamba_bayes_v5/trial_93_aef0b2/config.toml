[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 113
d_model = 466
n_layers = 6
d_state = 21
d_conv = 3
expand = 2
dropout = 0.33205319232179936

[training]
max_epochs = 150
batch_size = 213
learning_rate = 0.0016756383817756976
weight_decay = 0.00016367670925769687
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
