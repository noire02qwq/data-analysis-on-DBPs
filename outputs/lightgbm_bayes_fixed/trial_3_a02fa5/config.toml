[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 29
learning_rate = 0.1
n_estimators = 100
min_child_samples = 85
subsample = 0.9274480297311956
colsample_bytree = 0.8485140354755732
reg_alpha = 0.07802564022726911
reg_lambda = 2.868495369185897

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.004682077645680735
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
