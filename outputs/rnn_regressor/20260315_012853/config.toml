[model]
type = "RNN"
name = "rnn_regressor"
history_length = 19
units = 244
num_layers = 4
dropout = 0.30896012205679135

[training]
max_epochs = 10
batch_size = 246
learning_rate = 0.006694920525844477
weight_decay = 0.0042530976762665965
patience = 5
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
]
