[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 112
d_model = 335
n_layers = 11
d_state = 36
d_conv = 3
expand = 3
dropout = 0.3545065406784621
batch_size = 164
learning_rate = 0.0005664566351413343
weight_decay = 0.004485872937329086

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
