[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 13
learning_rate = 0.1
n_estimators = 100
min_child_weight = 2
subsample = 0.6015701148618166
colsample_bytree = 0.8254800904874268
gamma = 0.019182407114004364
reg_lambda = 2.545795658527725

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.026792664107731862
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
