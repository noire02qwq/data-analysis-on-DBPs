[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 82
d_model = 123
nhead = 16
num_encoder_layers = 6
dim_feedforward = 295
dropout = 0.060914355655325304

[training]
max_epochs = 150
batch_size = 95
learning_rate = 0.0002210635023640704
weight_decay = 0.00015770845853252058
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
