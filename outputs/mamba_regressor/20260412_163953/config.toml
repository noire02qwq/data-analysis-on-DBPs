[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 114
d_model = 383
n_layers = 9
d_state = 20
d_conv = 6
expand = 4
dropout = 0.4057878904001327

[training]
max_epochs = 150
batch_size = 264
learning_rate = 0.001308078958280167
weight_decay = 0.001354768897974513
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
