[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 189
d_model = 97
d_state = 53
d_conv = 6
expand = 3
num_layers = 2
dropout = 0.2087876545386961
n_layers = 4

[training]
max_epochs = 150
batch_size = 225
learning_rate = 0.0009074984722441366
weight_decay = 0.006886842661425621
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
