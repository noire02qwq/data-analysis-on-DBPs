[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 189
d_model = 405
n_layers = 4
d_state = 46
d_conv = 6
expand = 3
dropout = 0.4245744028374915
batch_size = 203
learning_rate = 0.0004892382278657691
weight_decay = 0.002875930534963955

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
