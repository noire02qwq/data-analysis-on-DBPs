[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 123
d_model = 509
d_state = 20
d_conv = 4
expand = 2
num_layers = 2
dropout = 0.2864750878829152
n_layers = 9

[training]
max_epochs = 150
batch_size = 266
learning_rate = 0.0011072426241676872
weight_decay = 0.00024324610973050563
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
