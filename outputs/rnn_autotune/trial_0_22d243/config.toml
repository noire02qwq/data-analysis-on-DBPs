[model]
type = "RNN"
name = "rnn_regressor"
history_length = 22
units = 253
num_layers = 3
dropout = 0.19683010978116317

[training]
max_epochs = 10
batch_size = 177
learning_rate = 0.00020611978805569315
weight_decay = 0.0009202922395409765
patience = 5
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
]
