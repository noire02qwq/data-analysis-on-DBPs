[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 177
d_model = 457
n_layers = 7
d_state = 8
d_conv = 3
expand = 3
dropout = 0.12774166596050388
batch_size = 376
learning_rate = 0.001932576932062636
weight_decay = 0.0001602799345239423

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
