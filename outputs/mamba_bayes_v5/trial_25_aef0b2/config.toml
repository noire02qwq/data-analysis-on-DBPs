[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 127
d_model = 118
n_layers = 7
d_state = 8
d_conv = 3
expand = 4
dropout = 0.38365832624039165

[training]
max_epochs = 150
batch_size = 286
learning_rate = 0.0014579236170850413
weight_decay = 0.00027225321876201347
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
