[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 113
d_model = 512
n_layers = 8
d_state = 8
d_conv = 3
expand = 3
dropout = 0.22556154203046358

[training]
max_epochs = 150
batch_size = 197
learning_rate = 0.001489598453645086
weight_decay = 0.0007009767845601174
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
