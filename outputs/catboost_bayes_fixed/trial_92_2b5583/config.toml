[model]
type = "CATBOOST"
name = "catboost_regressor"
history_length = 1
depth = 6
learning_rate = 0.1
iterations = 100
l2_leaf_reg = 1.8453497552451412
subsample = 0.794107957204478
random_strength = 0.32359159132030196
bagging_temperature = 0.006549266272782352

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0022017121860081544
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
