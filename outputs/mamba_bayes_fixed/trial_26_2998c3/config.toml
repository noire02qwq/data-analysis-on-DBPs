[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 169
d_model = 230
d_state = 24
d_conv = 4
expand = 3
num_layers = 2
dropout = 0.23430371050127963
n_layers = 7

[training]
max_epochs = 150
batch_size = 184
learning_rate = 0.0013202317797538338
weight_decay = 0.00018902292425779677
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
