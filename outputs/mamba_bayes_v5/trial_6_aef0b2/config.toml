[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 89
d_model = 392
n_layers = 5
d_state = 45
d_conv = 2
expand = 3
dropout = 0.14785327879496685

[training]
max_epochs = 150
batch_size = 166
learning_rate = 0.000976706144493597
weight_decay = 0.008115762750478414
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
