[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 192
d_model = 432
d_state = 51
d_conv = 5
expand = 2
num_layers = 2
dropout = 0.44317239541761055
n_layers = 7

[training]
max_epochs = 150
batch_size = 246
learning_rate = 0.0014937398314170166
weight_decay = 0.00018142384542188473
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
