[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 176
d_model = 279
n_layers = 8
d_state = 46
d_conv = 8
expand = 3
dropout = 0.29828178129014726
batch_size = 236
learning_rate = 0.0005281858162954078
weight_decay = 0.007151052029864241

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
