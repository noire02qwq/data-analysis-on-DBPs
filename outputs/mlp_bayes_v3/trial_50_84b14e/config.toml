[model]
type = "MLP"
name = "mlp_regressor"
history_length = 1
hidden_layers = [
    442,
    221,
    110,
]
dropout = 0.06326514021442065
batch_size = 79
learning_rate = 0.0025013525383996405
weight_decay = 8.686644629634952e-05

[training]
max_epochs = 150
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
