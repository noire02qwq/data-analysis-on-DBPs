[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 122
d_model = 232
nhead = 4
num_encoder_layers = 2
dim_feedforward = 262
dropout = 0.13300247556151282

[training]
max_epochs = 150
batch_size = 97
learning_rate = 0.00013469415691956638
weight_decay = 1.0740301983857968e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
