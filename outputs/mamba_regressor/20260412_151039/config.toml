[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 162
d_model = 303
n_layers = 12
d_state = 24
d_conv = 7
expand = 2
dropout = 0.1367701614738375

[training]
max_epochs = 150
batch_size = 188
learning_rate = 0.00046769820485684916
weight_decay = 0.00016184958644847007
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
