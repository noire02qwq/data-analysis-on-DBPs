[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 133
d_model = 165
d_state = 20
d_conv = 6
expand = 3
num_layers = 2
dropout = 0.11243731829861238
n_layers = 4

[training]
max_epochs = 150
batch_size = 256
learning_rate = 0.00045171192562145664
weight_decay = 0.0027834905268971045
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
