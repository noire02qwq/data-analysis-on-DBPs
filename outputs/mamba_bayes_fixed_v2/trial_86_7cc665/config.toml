[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 86
d_model = 412
n_layers = 4
d_state = 21
d_conv = 3
expand = 2
dropout = 0.24462131250660643

[training]
max_epochs = 150
batch_size = 241
learning_rate = 0.0008826420940369354
weight_decay = 0.002832145928768365
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
