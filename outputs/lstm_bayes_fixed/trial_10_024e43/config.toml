[model]
type = "LSTM"
name = "lstm_regressor"
history_length = 79
units = 384
num_layers = 1
dropout = 0.49386011262769447

[training]
max_epochs = 150
batch_size = 315
learning_rate = 0.0019710983163011464
weight_decay = 0.00010471375191115001
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
