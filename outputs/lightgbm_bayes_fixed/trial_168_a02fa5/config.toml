[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 28
learning_rate = 0.1
n_estimators = 100
min_child_samples = 64
subsample = 0.7365458629924662
colsample_bytree = 0.849296428858974
reg_alpha = 0.0227208371818056
reg_lambda = 1.2566715249946674

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.008971941763910302
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
