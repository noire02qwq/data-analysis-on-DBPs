[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 32
d_model = 465
n_layers = 12
d_state = 14
d_conv = 2
expand = 3
dropout = 0.13026680208851427

[training]
max_epochs = 150
batch_size = 338
learning_rate = 0.0010654792110832622
weight_decay = 0.007793119870051683
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
