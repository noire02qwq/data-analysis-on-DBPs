[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 142
d_model = 355
n_layers = 9
d_state = 29
d_conv = 6
expand = 3
dropout = 0.42405723437201115

[training]
max_epochs = 150
batch_size = 185
learning_rate = 0.0012385314578607746
weight_decay = 0.00012166486072109667
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
