[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 25
learning_rate = 0.1
n_estimators = 100
min_child_weight = 2
subsample = 0.7078613240798841
colsample_bytree = 0.7389398863551409
gamma = 1.3034644845113275
reg_lambda = 3.490269376829649

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.003537587347606117
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
