[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 4
learning_rate = 0.1
n_estimators = 100
min_child_samples = 61
subsample = 0.7941042154155442
colsample_bytree = 0.9863290581415842
reg_alpha = 0.06096774135985863
reg_lambda = 3.8171411776242987

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.00234676840566748
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
