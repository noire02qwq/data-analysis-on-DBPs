[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 83
d_model = 238
d_state = 44
d_conv = 4
expand = 4
num_layers = 2
dropout = 0.4907743472296827
n_layers = 2

[training]
max_epochs = 150
batch_size = 133
learning_rate = 0.0007319334249898458
weight_decay = 0.00013858265625480586
