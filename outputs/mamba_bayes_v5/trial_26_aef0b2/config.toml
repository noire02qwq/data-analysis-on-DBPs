[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 180
d_model = 175
n_layers = 9
d_state = 21
d_conv = 2
expand = 3
dropout = 0.20693149585404663

[training]
max_epochs = 150
batch_size = 240
learning_rate = 0.0017699882316879756
weight_decay = 0.0006549225248821709
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
