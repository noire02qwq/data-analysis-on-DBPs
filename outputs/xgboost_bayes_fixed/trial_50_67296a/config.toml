[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 27
learning_rate = 0.1
n_estimators = 100
min_child_weight = 2
subsample = 0.6433479664905569
colsample_bytree = 0.8271691699675477
gamma = 0.2650940352969515
reg_lambda = 4.487369264978576

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.005028370787515695
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
