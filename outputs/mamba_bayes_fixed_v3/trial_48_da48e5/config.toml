[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 104
d_model = 292
n_layers = 7
d_state = 53
d_conv = 7
expand = 3
dropout = 0.39893404103115876

[training]
max_epochs = 150
batch_size = 201
learning_rate = 0.0008181780158400437
weight_decay = 0.0005779077062734782
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
