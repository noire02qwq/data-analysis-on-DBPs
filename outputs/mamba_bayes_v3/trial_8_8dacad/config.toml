[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 139
d_model = 423
n_layers = 11
d_state = 56
d_conv = 3
expand = 4
dropout = 0.3218853462369931
batch_size = 222
learning_rate = 0.00042679706793435717
weight_decay = 0.0003443096551542091

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
