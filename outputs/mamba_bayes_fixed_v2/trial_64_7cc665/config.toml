[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 74
d_model = 223
n_layers = 10
d_state = 30
d_conv = 5
expand = 3
dropout = 0.13748543520641685

[training]
max_epochs = 150
batch_size = 175
learning_rate = 0.0010596096917587967
weight_decay = 0.0011460692107547808
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
