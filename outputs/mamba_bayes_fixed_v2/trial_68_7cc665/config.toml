[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 82
d_model = 383
n_layers = 6
d_state = 43
d_conv = 4
expand = 3
dropout = 0.11635362241356009

[training]
max_epochs = 150
batch_size = 231
learning_rate = 0.0006352855658715371
weight_decay = 0.0020180894339120767
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
