[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 190
d_model = 449
d_state = 61
d_conv = 4
expand = 2
num_layers = 2
dropout = 0.18218146640672928
n_layers = 2

[training]
max_epochs = 150
batch_size = 275
learning_rate = 0.0010982856273177154
weight_decay = 0.00019543210009294445
