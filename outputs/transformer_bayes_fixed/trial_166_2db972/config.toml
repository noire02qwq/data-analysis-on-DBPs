[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 132
d_model = 69
nhead = 8
num_encoder_layers = 6
dim_feedforward = 454
dropout = 0.255543925655992

[training]
max_epochs = 150
batch_size = 181
learning_rate = 0.00031404332113328236
weight_decay = 0.005186162933360424
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
