[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 48
d_model = 238
n_layers = 10
d_state = 21
d_conv = 4
expand = 2
dropout = 0.19097933411060924

[training]
max_epochs = 150
batch_size = 277
learning_rate = 0.001365960942768076
weight_decay = 0.002039253784930863
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
