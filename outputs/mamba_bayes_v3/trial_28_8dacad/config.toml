[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 141
d_model = 332
n_layers = 4
d_state = 29
d_conv = 6
expand = 2
dropout = 0.20768001057334431
batch_size = 152
learning_rate = 0.0013067641380469586
weight_decay = 0.001793623391521585

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
