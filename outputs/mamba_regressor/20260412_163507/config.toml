[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 111
d_model = 426
n_layers = 7
d_state = 16
d_conv = 5
expand = 4
dropout = 0.36313451933794916

[training]
max_epochs = 150
batch_size = 298
learning_rate = 0.001207390111048131
weight_decay = 0.001244021998598769
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
