[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 184
d_model = 86
d_state = 50
d_conv = 4
expand = 2
num_layers = 2
dropout = 0.2304656813581759
n_layers = 6

[training]
max_epochs = 150
batch_size = 226
learning_rate = 0.001159468450632139
weight_decay = 0.00016161298916590638
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
