[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 147
d_model = 475
d_state = 17
d_conv = 4
expand = 2
num_layers = 2
dropout = 0.3679969943445232
n_layers = 6

[training]
max_epochs = 150
batch_size = 256
learning_rate = 0.0015105876999022242
weight_decay = 0.00019285260445940755
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
