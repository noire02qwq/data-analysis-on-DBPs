[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 39
d_model = 64
nhead = 16
num_encoder_layers = 6
dim_feedforward = 468
dropout = 0.2967712733674143

[training]
max_epochs = 150
batch_size = 144
learning_rate = 0.00022078269854492152
weight_decay = 0.0036947060527938573
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
