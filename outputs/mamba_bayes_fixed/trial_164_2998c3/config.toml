[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 189
d_model = 105
d_state = 9
d_conv = 2
expand = 3
num_layers = 2
dropout = 0.197157819089778
n_layers = 5

[training]
max_epochs = 150
batch_size = 137
learning_rate = 0.0009974407373340296
weight_decay = 0.00025437827079442056
