[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 26
learning_rate = 0.1
n_estimators = 100
min_child_weight = 10
subsample = 0.7627429867123672
colsample_bytree = 0.6305904608150708
gamma = 0.4131754637795924
reg_lambda = 3.205495616642212

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0027430547865078866
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
