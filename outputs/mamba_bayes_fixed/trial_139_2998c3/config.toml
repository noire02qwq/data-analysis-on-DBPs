[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 40
d_model = 116
d_state = 38
d_conv = 3
expand = 2
num_layers = 2
dropout = 0.10779847340042614
n_layers = 3

[training]
max_epochs = 150
batch_size = 279
learning_rate = 0.0017590508873583212
weight_decay = 0.00013951694557071557
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
