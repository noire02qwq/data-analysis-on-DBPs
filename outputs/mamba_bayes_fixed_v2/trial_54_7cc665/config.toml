[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 151
d_model = 420
n_layers = 12
d_state = 16
d_conv = 5
expand = 3
dropout = 0.23866817850795388

[training]
max_epochs = 150
batch_size = 270
learning_rate = 0.0006456537656938504
weight_decay = 0.0044408533264544215
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
