[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 136
d_model = 64
nhead = 4
num_encoder_layers = 4
dim_feedforward = 328
dropout = 0.09054457204982017

[training]
max_epochs = 150
batch_size = 191
learning_rate = 0.00031734975310621175
weight_decay = 0.0050544823291470845
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
