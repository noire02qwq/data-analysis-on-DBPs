[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 157
d_model = 289
n_layers = 11
d_state = 18
d_conv = 5
expand = 3
dropout = 0.3534128916559271

[training]
max_epochs = 150
batch_size = 381
learning_rate = 0.0014788158444525826
weight_decay = 0.0012096690938815412
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
