[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 135
d_model = 186
n_layers = 4
d_state = 37
d_conv = 5
expand = 4
dropout = 0.19152773849925697

[training]
max_epochs = 150
batch_size = 205
learning_rate = 0.0006327728762560826
weight_decay = 0.0001438688841103624
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
