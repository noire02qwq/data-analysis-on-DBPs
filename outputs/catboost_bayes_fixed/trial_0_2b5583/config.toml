[model]
type = "CATBOOST"
name = "catboost_regressor"
history_length = 1
depth = 5
learning_rate = 0.1
iterations = 100
l2_leaf_reg = 3.949665237145836
subsample = 0.7922514587231392
random_strength = 0.21138405679251202
bagging_temperature = 0.013395962950805506

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.009689226025763761
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
