[model]
type = "XGBOOST"
name = "xgboost_final"

max_depth = 8
learning_rate = 0.05
subsample = 0.9
colsample_bytree = 0.8
gamma = 0.0
reg_lambda = 1.0
min_child_weight = 1.0
[training]
max_epochs = 150
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = ["TRC-DT", "pH-DT", "cond-DT", "TRC-RT", "pH-RT", "cond-RT", "fDOM-RT", "DO-RT", "TOC-RT", "DOC-RT"]
output_columns = ["TRC-PPL2"]
