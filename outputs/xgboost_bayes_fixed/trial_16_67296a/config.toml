[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 20
learning_rate = 0.1
n_estimators = 100
min_child_weight = 9
subsample = 0.7614083252257954
colsample_bytree = 0.6743477572175284
gamma = 0.00331956128689438
reg_lambda = 2.1938318673538695

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.009272760526729444
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
