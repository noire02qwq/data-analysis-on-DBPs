[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 192
d_model = 131
n_layers = 3
d_state = 59
d_conv = 6
expand = 4
dropout = 0.3256273673281704

[training]
max_epochs = 150
batch_size = 295
learning_rate = 0.0011227994236030472
weight_decay = 0.004883109792620035
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
