[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 54
d_model = 383
d_state = 36
d_conv = 2
expand = 2
num_layers = 2
dropout = 0.21800940586827053
n_layers = 5

[training]
max_epochs = 150
batch_size = 182
learning_rate = 0.0005358352536178116
weight_decay = 0.007697876469712982
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
