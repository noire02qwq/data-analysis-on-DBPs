[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 43
d_model = 487
n_layers = 8
d_state = 11
d_conv = 2
expand = 3
dropout = 0.10518915986982603

[training]
max_epochs = 150
batch_size = 327
learning_rate = 0.0007733586671007904
weight_decay = 0.006069189270447063
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
