[model]
type = "MLP"
name = "mlp_regressor"
history_length = 1
hidden_layers = [
    474,
    237,
    118,
    59,
]
dropout = 0.17920212972531951
batch_size = 192
learning_rate = 0.00041048809752988893
weight_decay = 0.0003626724844319374

[training]
max_epochs = 150
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
