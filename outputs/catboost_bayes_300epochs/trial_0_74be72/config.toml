[model]
type = "CATBOOST"
name = "catboost_regressor"
depth = 11
learning_rate = 0.05
l2_leaf_reg = 1.1292658261865378
subsample = 0.9919247169186988
random_strength = 0.6560900904620964
bagging_temperature = 0.0508843298966772

[training]
max_epochs = 300
batch_size = 256
learning_rate = 0.0020109449036775427
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
