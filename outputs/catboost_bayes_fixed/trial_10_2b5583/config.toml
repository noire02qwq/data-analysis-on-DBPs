[model]
type = "CATBOOST"
name = "catboost_regressor"
history_length = 1
depth = 11
learning_rate = 0.1
iterations = 100
l2_leaf_reg = 1.0044576173826623
subsample = 0.6018616743087846
random_strength = 0.5163226120887355
bagging_temperature = 0.09344537446757087

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.011932177379689619
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
