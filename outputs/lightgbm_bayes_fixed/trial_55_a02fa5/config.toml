[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 8
learning_rate = 0.1
n_estimators = 100
min_child_samples = 77
subsample = 0.7871265915866871
colsample_bytree = 0.9685604438441618
reg_alpha = 0.035070701239313606
reg_lambda = 2.7555838736295715

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.002803029193391285
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
