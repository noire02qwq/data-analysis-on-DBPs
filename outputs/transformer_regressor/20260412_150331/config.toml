[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 134
d_model = 141
nhead = 16
num_encoder_layers = 5
dim_feedforward = 316
dropout = 0.17289327610222263

[training]
max_epochs = 150
batch_size = 112
learning_rate = 0.00025079495730403583
weight_decay = 1.1326691180469714e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
