[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 34
d_model = 136
nhead = 16
num_encoder_layers = 6
dim_feedforward = 1020
dropout = 0.29715314501827583

[training]
max_epochs = 150
batch_size = 255
learning_rate = 0.0007518372878092192
weight_decay = 0.006972783277462518
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
