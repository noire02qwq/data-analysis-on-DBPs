[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 14
learning_rate = 0.1
n_estimators = 100
min_child_weight = 1
subsample = 0.6711246990187589
colsample_bytree = 0.8185097200344351
gamma = 0.0013116405239623368
reg_lambda = 2.1202707947552493

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0175473692536008
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
