[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 168
d_model = 387
n_layers = 8
d_state = 26
d_conv = 6
expand = 2
dropout = 0.3909352543383301

[training]
max_epochs = 150
batch_size = 280
learning_rate = 0.0010707446499498901
weight_decay = 0.0007805006479160359
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
