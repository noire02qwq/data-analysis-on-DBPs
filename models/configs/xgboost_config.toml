[model]
type = "MLP"
name = "mlp_regressor"
hidden_layers = [256, 128, 64]
dropout = 0.2

[training]
max_epochs = 10
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 5
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT", "pH-DT", "cond-DT", "TRC-RT", "pH-RT", "fDOM-RT", "DO-RT",
    "TOC-RT", "DOC-RT"
]
output_columns = ["TRC-PPL1", "TRC-PPL2"]
