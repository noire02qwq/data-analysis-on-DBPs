[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 178
d_model = 429
n_layers = 6
d_state = 46
d_conv = 6
expand = 3
dropout = 0.11896880593704448
batch_size = 138
learning_rate = 0.0011808005998214409
weight_decay = 0.0038066117607577603

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
