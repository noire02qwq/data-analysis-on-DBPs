[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 65
d_model = 155
nhead = 8
num_encoder_layers = 3
dim_feedforward = 981
dropout = 0.06710838790381965

[training]
max_epochs = 150
batch_size = 200
learning_rate = 0.000510713076455382
weight_decay = 0.006755201594510437
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
