[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 127
d_model = 497
n_layers = 8
d_state = 44
d_conv = 8
expand = 3
dropout = 0.2920918872590974

[training]
max_epochs = 150
batch_size = 177
learning_rate = 0.0004301633199318165
weight_decay = 0.004062955938301832
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
