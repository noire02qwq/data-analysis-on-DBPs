[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 169
d_model = 510
n_layers = 7
d_state = 8
d_conv = 2
expand = 2
dropout = 0.12674294770790398
batch_size = 152
learning_rate = 0.0005865494095892275
weight_decay = 0.0002618293681855905

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
