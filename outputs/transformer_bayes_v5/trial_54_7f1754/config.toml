[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 97
d_model = 155
nhead = 16
num_encoder_layers = 4
dim_feedforward = 933
dropout = 0.09744222324987546

[training]
max_epochs = 150
batch_size = 106
learning_rate = 0.0005712173762858071
weight_decay = 0.00011207118731489273
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
