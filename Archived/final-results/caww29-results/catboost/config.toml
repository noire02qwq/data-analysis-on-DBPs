[model]
type = "CATBOOST"
name = "catboost_regressor"
depth = 4
learning_rate = 0.0030710271115583676
l2_leaf_reg = 4.1567669426800276
subsample = 0.5475228380493571
random_strength = 0.003050658610884564
bagging_temperature = 0.003943608459098256

[training]
max_epochs = 300
batch_size = 554
learning_rate = 0.05
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
