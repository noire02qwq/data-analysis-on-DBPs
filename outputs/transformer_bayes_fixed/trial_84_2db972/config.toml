[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 35
d_model = 70
nhead = 16
num_encoder_layers = 6
dim_feedforward = 582
dropout = 0.08652446856951357

[training]
max_epochs = 150
batch_size = 156
learning_rate = 0.00037166486624268713
weight_decay = 0.006154241137790231
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
