[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 51
d_model = 157
n_layers = 12
d_state = 42
d_conv = 6
expand = 3
dropout = 0.45591651720358295

[training]
max_epochs = 150
batch_size = 324
learning_rate = 0.0005532242493681975
weight_decay = 0.0009603000426802519
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
