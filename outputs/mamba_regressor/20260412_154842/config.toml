[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 167
d_model = 235
n_layers = 5
d_state = 18
d_conv = 4
expand = 4
dropout = 0.3072491658180285

[training]
max_epochs = 150
batch_size = 225
learning_rate = 0.0009083148473380329
weight_decay = 0.00016557072408423425
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
