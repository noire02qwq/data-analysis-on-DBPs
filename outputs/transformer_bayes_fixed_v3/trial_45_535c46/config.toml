[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 87
d_model = 229
nhead = 16
num_encoder_layers = 3
dim_feedforward = 604
dropout = 0.062016686528443936

[training]
max_epochs = 150
batch_size = 74
learning_rate = 0.0029146957743766255
weight_decay = 8.305789917444114e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
