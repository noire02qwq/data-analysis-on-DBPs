[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 153
d_model = 247
n_layers = 2
d_state = 44
d_conv = 6
expand = 3
dropout = 0.12096079222726569

[training]
max_epochs = 150
batch_size = 156
learning_rate = 0.001513405756295867
weight_decay = 0.005252887528418003
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
