[model]
type = "LSTM"
name = "lstm_regressor"
history_length = 104
units = 206
num_layers = 1
dropout = 0.35581720020119595

[training]
max_epochs = 150
batch_size = 341
learning_rate = 0.00040758728768506083
weight_decay = 0.00022026454353341559
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
