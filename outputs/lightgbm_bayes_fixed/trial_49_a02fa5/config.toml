[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 7
learning_rate = 0.1
n_estimators = 100
min_child_samples = 57
subsample = 0.7723201619330536
colsample_bytree = 0.9658449673095887
reg_alpha = 0.06901530560665883
reg_lambda = 2.667826279683874

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0033388621517489235
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
