[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 146
d_model = 462
n_layers = 2
d_state = 36
d_conv = 2
expand = 4
dropout = 0.3919010821975403

[training]
max_epochs = 150
batch_size = 161
learning_rate = 0.0010131629989254614
weight_decay = 0.0077555750005364995
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
