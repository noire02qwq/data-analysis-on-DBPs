[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 28
learning_rate = 0.1
n_estimators = 100
min_child_weight = 6
subsample = 0.6562530573109213
colsample_bytree = 0.9998498146294321
gamma = 0.043223545600897056
reg_lambda = 4.309197869146015

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.005440770397185515
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
