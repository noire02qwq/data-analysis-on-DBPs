[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 58
d_model = 316
n_layers = 7
d_state = 16
d_conv = 4
expand = 3
dropout = 0.3698623550706331

[training]
max_epochs = 150
batch_size = 154
learning_rate = 0.0018278885980929646
weight_decay = 0.0003188643712463004
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
