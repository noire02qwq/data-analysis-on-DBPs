[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 101
d_model = 416
n_layers = 10
d_state = 12
d_conv = 2
expand = 4
dropout = 0.17828822701265107

[training]
max_epochs = 150
batch_size = 225
learning_rate = 0.000686341259339338
weight_decay = 0.0005985824635563488
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
