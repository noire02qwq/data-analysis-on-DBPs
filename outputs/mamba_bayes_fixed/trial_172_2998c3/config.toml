[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 186
d_model = 413
d_state = 59
d_conv = 5
expand = 2
num_layers = 2
dropout = 0.43854750856445057
n_layers = 8

[training]
max_epochs = 150
batch_size = 252
learning_rate = 0.0014122282449989005
weight_decay = 0.00023716894687016355
