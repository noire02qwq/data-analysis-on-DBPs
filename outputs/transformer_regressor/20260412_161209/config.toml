[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 128
d_model = 161
nhead = 16
num_encoder_layers = 4
dim_feedforward = 726
dropout = 0.06947339818732133

[training]
max_epochs = 150
batch_size = 177
learning_rate = 0.0001619948433939812
weight_decay = 3.797069573013847e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
