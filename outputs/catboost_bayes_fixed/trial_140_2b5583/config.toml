[model]
type = "CATBOOST"
name = "catboost_regressor"
history_length = 1
depth = 9
learning_rate = 0.1
iterations = 100
l2_leaf_reg = 1.1360925988080468
subsample = 0.8686469542606894
random_strength = 0.4569340019615603
bagging_temperature = 0.038763098051283716

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0037424340581705905
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
