[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 4
learning_rate = 0.1
n_estimators = 100
min_child_samples = 73
subsample = 0.7489096183322251
colsample_bytree = 0.8236363032642179
reg_alpha = 0.10060457627224362
reg_lambda = 4.014872134228028

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0038070157414312454
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
