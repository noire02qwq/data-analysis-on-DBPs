[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 183
d_model = 482
n_layers = 5
d_state = 23
d_conv = 4
expand = 2
dropout = 0.16246920345355392
batch_size = 173
learning_rate = 0.0007081900330614255
weight_decay = 0.00032487832757614076

[training]
max_epochs = 100
batch_size = 128
