[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 77
d_model = 136
nhead = 4
num_encoder_layers = 5
dim_feedforward = 630
dropout = 0.10084440253116153

[training]
max_epochs = 150
batch_size = 177
learning_rate = 0.00126641455205515
weight_decay = 9.77377528982726e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
