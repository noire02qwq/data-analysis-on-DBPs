[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 85
d_model = 303
n_layers = 7
d_state = 17
d_conv = 4
expand = 4
dropout = 0.320215953853074

[training]
max_epochs = 150
batch_size = 238
learning_rate = 0.0007821815456048074
weight_decay = 0.006687353291125143
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
