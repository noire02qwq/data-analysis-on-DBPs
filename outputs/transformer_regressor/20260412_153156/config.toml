[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 60
d_model = 222
nhead = 8
num_encoder_layers = 4
dim_feedforward = 1024
dropout = 0.14383075272630855

[training]
max_epochs = 150
batch_size = 130
learning_rate = 0.002085857850603016
weight_decay = 1.4264572829500182e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
