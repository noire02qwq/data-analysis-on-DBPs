[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 101
d_model = 281
n_layers = 8
d_state = 20
d_conv = 4
expand = 4
dropout = 0.152915023597117

[training]
max_epochs = 150
batch_size = 292
learning_rate = 0.0006246747592438108
weight_decay = 0.001007595379618958
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
