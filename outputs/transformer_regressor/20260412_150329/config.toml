[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 83
d_model = 169
nhead = 4
num_encoder_layers = 6
dim_feedforward = 975
dropout = 0.06456824994538078

[training]
max_epochs = 150
batch_size = 122
learning_rate = 0.0005158786103525932
weight_decay = 0.00032164974766862083
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
