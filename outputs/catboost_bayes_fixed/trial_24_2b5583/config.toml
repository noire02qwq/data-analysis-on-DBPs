[model]
type = "CATBOOST"
name = "catboost_regressor"
history_length = 1
depth = 8
learning_rate = 0.1
iterations = 100
l2_leaf_reg = 2.176818410233368
subsample = 0.7767816520636445
random_strength = 0.352245263280147
bagging_temperature = 0.0022751495535048905

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0027121966397208822
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
