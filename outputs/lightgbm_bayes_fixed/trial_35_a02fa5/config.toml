[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 14
learning_rate = 0.1
n_estimators = 100
min_child_samples = 91
subsample = 0.7953233733708757
colsample_bytree = 0.8294235875445449
reg_alpha = 1.0000055307208044
reg_lambda = 1.8669147305114562

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0020513329399628275
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
