[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 110
d_model = 216
n_layers = 4
d_state = 20
d_conv = 5
expand = 2
dropout = 0.36449800149364525

[training]
max_epochs = 150
batch_size = 349
learning_rate = 0.0013507640262089688
weight_decay = 0.00015480780745144153
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
