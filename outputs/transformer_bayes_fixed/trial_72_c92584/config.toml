[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 52
d_model = 244
nhead = 16
num_encoder_layers = 2
dim_feedforward = 854
dropout = 0.05145221291663835

[training]
max_epochs = 150
batch_size = 243
learning_rate = 0.0027905418762532467
weight_decay = 0.0008719826081929761
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
