[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 10
learning_rate = 0.1
n_estimators = 100
min_child_samples = 80
subsample = 0.7619130458414791
colsample_bytree = 0.7322625489459408
reg_alpha = 0.1688270437261478
reg_lambda = 1.4238070672636078

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.004155552614416026
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
