[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 24
learning_rate = 0.1
n_estimators = 100
min_child_samples = 69
subsample = 0.7606160285663307
colsample_bytree = 0.803550367601987
reg_alpha = 0.019765655517589048
reg_lambda = 2.7589723187113537

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0053360095837335945
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
