[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 13
learning_rate = 0.1
n_estimators = 100
min_child_weight = 5
subsample = 0.9622579290273205
colsample_bytree = 0.8826518987366073
gamma = 0.010622383958727201
reg_lambda = 1.9828530659648682

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.006354009533647021
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
