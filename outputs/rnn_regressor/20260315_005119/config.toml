[model]
type = "RNN"
name = "rnn_regressor"
history_length = 64
units = 192
num_layers = 8
dropout = 0.35

[training]
max_epochs = 100
batch_size = 192
learning_rate = 0.0006
weight_decay = 0.0
patience = 50
seed = 947

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "temp-DT", "conductivity-DT", "pH-DT", "TRC-DT", "TOC-DT", "DOC-DT",
    "temp-RT", "conductivity-RT", "pH-RT", "TRC-RT", "TOC-RT", "DOC-RT"
]
output_columns = ["TRC-PPL1", "TRC-PPL2"]
