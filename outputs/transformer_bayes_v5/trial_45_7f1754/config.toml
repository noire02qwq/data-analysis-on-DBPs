[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 94
d_model = 232
nhead = 8
num_encoder_layers = 3
dim_feedforward = 515
dropout = 0.08238971860786655

[training]
max_epochs = 150
batch_size = 107
learning_rate = 0.0003668816814011272
weight_decay = 4.1691700102725865e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
