[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 185
d_model = 442
d_state = 61
d_conv = 6
expand = 2
num_layers = 2
dropout = 0.32964832531142063
n_layers = 7

[training]
max_epochs = 150
batch_size = 245
learning_rate = 0.0010303077190735347
weight_decay = 0.000219511916513388
