[model]
type = "RNN"
name = "rnn_regressor"
history_length = 62
units = 222
num_layers = 4
dropout = 0.3867145446110757

[training]
max_epochs = 10
batch_size = 98
learning_rate = 0.004955184651040029
weight_decay = 0.00010772369856244175
patience = 5
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
]
