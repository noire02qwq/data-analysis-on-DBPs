[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 127
d_model = 121
nhead = 4
num_encoder_layers = 5
dim_feedforward = 489
dropout = 0.07220093099175962

[training]
max_epochs = 150
batch_size = 241
learning_rate = 0.0003475778223658467
weight_decay = 0.0032383031043898263
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
