[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 192
d_model = 151
d_state = 52
d_conv = 6
expand = 3
num_layers = 2
dropout = 0.2513122530046332
n_layers = 7

[training]
max_epochs = 150
batch_size = 201
learning_rate = 0.001220395735850816
weight_decay = 0.00033896016426228495
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
