[model]
type = "MLP"
name = "mlp_regressor"
history_length = 1
hidden_layers = [
    458,
    229,
    114,
    57,
]
dropout = 0.08041899878494035
batch_size = 246
learning_rate = 0.000226911625897654
weight_decay = 0.0002127219121351097

[training]
max_epochs = 150
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
