[model]
type = "RNN"
name = "rnn_regressor"
history_length = 20
units = 190
num_layers = 3
dropout = 0.3400154726851765

[training]
max_epochs = 10
batch_size = 136
learning_rate = 0.006995323904304469
weight_decay = 0.0004299481195860172
patience = 5
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
]
