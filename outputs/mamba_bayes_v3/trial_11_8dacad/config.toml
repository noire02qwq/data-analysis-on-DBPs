[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 91
d_model = 307
n_layers = 2
d_state = 25
d_conv = 5
expand = 4
dropout = 0.4959221547105403
batch_size = 130
learning_rate = 0.0010306170525693945
weight_decay = 0.0003100817132349355

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
