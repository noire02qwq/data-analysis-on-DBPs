[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 116
d_model = 78
nhead = 16
num_encoder_layers = 5
dim_feedforward = 710
dropout = 0.07332200802584654

[training]
max_epochs = 150
batch_size = 169
learning_rate = 0.0006103624219268198
weight_decay = 1.6251784832890718e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
