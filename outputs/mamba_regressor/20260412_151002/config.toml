[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 83
d_model = 458
n_layers = 5
d_state = 44
d_conv = 3
expand = 2
dropout = 0.37726085480002125

[training]
max_epochs = 150
batch_size = 224
learning_rate = 0.0006787416382170576
weight_decay = 0.0010893133917507353
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
