[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 179
d_model = 343
n_layers = 7
d_state = 45
d_conv = 5
expand = 3
dropout = 0.378620159399002

[training]
max_epochs = 150
batch_size = 259
learning_rate = 0.0005893520228716684
weight_decay = 0.0030469879955410195
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
