[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 56
d_model = 84
nhead = 4
num_encoder_layers = 6
dim_feedforward = 471
dropout = 0.23082553682085258

[training]
max_epochs = 150
batch_size = 163
learning_rate = 0.00022885988357368377
weight_decay = 0.00017368616363037627
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
