[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 110
d_model = 102
n_layers = 11
d_state = 11
d_conv = 4
expand = 4
dropout = 0.10312574114836467

[training]
max_epochs = 150
batch_size = 353
learning_rate = 0.0005023967521797391
weight_decay = 0.001531771622070968
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
