[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 15
learning_rate = 0.1
n_estimators = 100
min_child_weight = 8
subsample = 0.6386174515810756
colsample_bytree = 0.797884987350581
gamma = 0.07768086361842401
reg_lambda = 1.4312609751251926

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.016597340898857546
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
