[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 20
learning_rate = 0.1
n_estimators = 100
min_child_samples = 75
subsample = 0.7766695051825784
colsample_bytree = 0.7123341399652098
reg_alpha = 0.0032189537295526905
reg_lambda = 0.7835373073564368

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.007505274537979644
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
