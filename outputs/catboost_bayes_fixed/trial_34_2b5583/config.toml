[model]
type = "CATBOOST"
name = "catboost_regressor"
history_length = 1
depth = 5
learning_rate = 0.1
iterations = 100
l2_leaf_reg = 2.0999655049815344
subsample = 0.7308640809923138
random_strength = 0.6158357311547389
bagging_temperature = 0.010735265860075572

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.002297079654052715
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
