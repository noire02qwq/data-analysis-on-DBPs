[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 184
d_model = 458
d_state = 62
d_conv = 6
expand = 2
num_layers = 2
dropout = 0.3558735075022876
n_layers = 7

[training]
max_epochs = 150
batch_size = 254
learning_rate = 0.0010568867640076407
