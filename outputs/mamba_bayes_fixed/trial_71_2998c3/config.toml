[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 58
d_model = 175
d_state = 19
d_conv = 2
expand = 2
num_layers = 2
dropout = 0.2971236946242138
n_layers = 11

[training]
max_epochs = 150
batch_size = 261
learning_rate = 0.0011522171657852066
weight_decay = 0.00024091092329495996
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
