[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 78
d_model = 208
nhead = 8
num_encoder_layers = 4
dim_feedforward = 905
dropout = 0.10698123210223003

[training]
max_epochs = 150
batch_size = 145
learning_rate = 0.0001275727296043896
weight_decay = 1.6588230264170755e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
