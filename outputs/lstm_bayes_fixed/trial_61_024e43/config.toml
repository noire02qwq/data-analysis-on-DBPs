[model]
type = "LSTM"
name = "lstm_regressor"
history_length = 103
units = 305
num_layers = 1
dropout = 0.33726971313255877

[training]
max_epochs = 150
batch_size = 332
learning_rate = 0.00038643539381558596
weight_decay = 0.0027318019313501167
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
