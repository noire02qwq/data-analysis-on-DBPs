[model]
type = "RNN"
name = "rnn_regressor"
history_length = 22
units = 205
num_layers = 1
dropout = 0.28927259303735636

[training]
max_epochs = 10
batch_size = 70
learning_rate = 0.00023463661567942366
weight_decay = 0.0026738663603487448
patience = 5
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
]
