[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 94
d_model = 214
nhead = 4
num_encoder_layers = 2
dim_feedforward = 296
dropout = 0.1141118749472962

[training]
max_epochs = 150
batch_size = 159
learning_rate = 0.0017640595050692073
weight_decay = 0.0053996549779176195
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
