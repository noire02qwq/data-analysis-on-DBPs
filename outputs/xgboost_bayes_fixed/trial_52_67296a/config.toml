[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 24
learning_rate = 0.1
n_estimators = 100
min_child_weight = 2
subsample = 0.7219631191136711
colsample_bytree = 0.7186042596177004
gamma = 0.5571664400177679
reg_lambda = 3.9006602071166605

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.005906801405888245
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
