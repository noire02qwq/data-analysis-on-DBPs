[model]
type = "CATBOOST"
name = "catboost_regressor"
history_length = 1
depth = 5
learning_rate = 0.1
iterations = 100
l2_leaf_reg = 2.58418190635485
subsample = 0.7029165747673937
random_strength = 0.2690969586948788
bagging_temperature = 0.03718306953153313

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.003502573129394574
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
