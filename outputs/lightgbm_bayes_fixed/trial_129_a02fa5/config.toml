[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 13
learning_rate = 0.1
n_estimators = 100
min_child_samples = 72
subsample = 0.7398740246095153
colsample_bytree = 0.8262665359001302
reg_alpha = 0.03453540957628531
reg_lambda = 1.659981471583834

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.008161098695524862
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
