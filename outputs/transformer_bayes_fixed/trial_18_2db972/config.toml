[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 116
d_model = 67
nhead = 8
num_encoder_layers = 2
dim_feedforward = 417
dropout = 0.1483471397224087

[training]
max_epochs = 150
batch_size = 97
learning_rate = 0.00011325889151846253
weight_decay = 0.0036644209515964976
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
