[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 157
d_model = 230
n_layers = 11
d_state = 33
d_conv = 5
expand = 2
dropout = 0.3529856068156085

[training]
max_epochs = 150
batch_size = 342
learning_rate = 0.0014789382577373854
weight_decay = 0.0009941084275835298
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
