[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 5
learning_rate = 0.1
n_estimators = 100
min_child_weight = 3
subsample = 0.6156207316710602
colsample_bytree = 0.8190948580009504
gamma = 0.012922570088776111
reg_lambda = 2.6980108456590735

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.019466762641775787
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
