[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 89
d_model = 231
nhead = 8
num_encoder_layers = 3
dim_feedforward = 792
dropout = 0.061529615924101

[training]
max_epochs = 150
batch_size = 99
learning_rate = 0.00027320864818509446
weight_decay = 0.0012020960743422183
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
