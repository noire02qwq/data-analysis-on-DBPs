[model]
type = "LSTM"
name = "lstm_regressor"
history_length = 100
units = 290
num_layers = 2
dropout = 0.11041527993760897

[training]
max_epochs = 150
batch_size = 187
learning_rate = 0.0002037529352885826
weight_decay = 0.00041237678396588277
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
