[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 11
learning_rate = 0.1
n_estimators = 100
min_child_samples = 93
subsample = 0.7269927724227181
colsample_bytree = 0.8179939496247148
reg_alpha = 0.73867944099783
reg_lambda = 1.719343950688975

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.004880536795542293
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
