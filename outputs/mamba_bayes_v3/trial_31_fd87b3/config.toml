[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 183
d_model = 458
n_layers = 7
d_state = 15
d_conv = 3
expand = 2
dropout = 0.1585215484794893
batch_size = 139
learning_rate = 0.0006295548521604777
weight_decay = 0.00013140923262471493

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
