[model]
name = "mamba_regressor"
type = "MAMBA"
d_model = 107
n_layers = 6
d_state = 62
d_conv = 6
expand = 3
dropout = 0.2686622469727605
history_length = 182

[training]
max_epochs = 200
batch_size = 196
learning_rate = 0.0009723577719271845
weight_decay = 0.00023185077526130217
patience = 20
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = ["TRC-DT", "pH-DT", "cond-DT", "TRC-RT", "pH-RT"]
output_columns = ["TRC-PPL1", "TRC-PPL2", "pH-PPL1", "pH-PPL2"]
