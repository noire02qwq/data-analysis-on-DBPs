[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 162
d_model = 421
d_state = 25
d_conv = 2
expand = 2
num_layers = 2
dropout = 0.4282273766551646
n_layers = 7

[training]
max_epochs = 150
batch_size = 263
learning_rate = 0.00042751722069926115
weight_decay = 0.0002805302715183759
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
