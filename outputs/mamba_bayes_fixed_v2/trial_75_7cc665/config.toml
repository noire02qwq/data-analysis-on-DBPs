[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 128
d_model = 320
n_layers = 7
d_state = 45
d_conv = 6
expand = 4
dropout = 0.2951368048660709

[training]
max_epochs = 150
batch_size = 271
learning_rate = 0.001988927660547318
weight_decay = 0.0062876649831837515
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
