[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 33
d_model = 186
n_layers = 3
d_state = 9
d_conv = 3
expand = 3
dropout = 0.23671330910674152

[training]
max_epochs = 150
batch_size = 303
learning_rate = 0.0013349337376639746
weight_decay = 0.005279137085018592
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
