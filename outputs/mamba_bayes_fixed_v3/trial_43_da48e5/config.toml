[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 182
d_model = 454
n_layers = 12
d_state = 56
d_conv = 7
expand = 4
dropout = 0.18797963677448193

[training]
max_epochs = 150
batch_size = 200
learning_rate = 0.0016125395617009842
weight_decay = 0.003421139707746684
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
