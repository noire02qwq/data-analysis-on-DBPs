[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 127
d_model = 78
nhead = 4
num_encoder_layers = 6
dim_feedforward = 331
dropout = 0.21510208463714847

[training]
max_epochs = 150
batch_size = 205
learning_rate = 0.00025545097149000303
weight_decay = 0.003350411623339844
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
