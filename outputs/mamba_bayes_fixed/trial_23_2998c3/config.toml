[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 190
d_model = 98
d_state = 8
d_conv = 4
expand = 3
num_layers = 2
dropout = 0.23929061774879176
n_layers = 5

[training]
max_epochs = 150
batch_size = 213
learning_rate = 0.0014941561754249733
weight_decay = 0.0001781376484417283
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
