[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 18
learning_rate = 0.1
n_estimators = 100
min_child_weight = 7
subsample = 0.6892426936219749
colsample_bytree = 0.6941044018918815
gamma = 0.06138161123213696
reg_lambda = 0.9802742954373302

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.023488257603009044
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
