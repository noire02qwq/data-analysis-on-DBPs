[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 154
d_model = 146
nhead = 16
num_encoder_layers = 2
dim_feedforward = 821
dropout = 0.11056803163040063

[training]
max_epochs = 150
batch_size = 134
learning_rate = 0.00024009483396202823
weight_decay = 9.807092154750507e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
