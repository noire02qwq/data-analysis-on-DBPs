[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 87
d_model = 187
nhead = 4
num_encoder_layers = 4
dim_feedforward = 458
dropout = 0.10403572967693385

[training]
max_epochs = 150
batch_size = 247
learning_rate = 0.00017388115155058377
weight_decay = 0.004339187158903487
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
