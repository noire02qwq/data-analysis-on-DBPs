[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 156
d_model = 480
n_layers = 10
d_state = 51
d_conv = 7
expand = 3
dropout = 0.23503858404389877

[training]
max_epochs = 150
batch_size = 217
learning_rate = 0.0005371471566263305
weight_decay = 0.002171115662482913
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
