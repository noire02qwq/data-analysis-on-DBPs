[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 66
d_model = 263
n_layers = 8
d_state = 24
d_conv = 4
expand = 4
dropout = 0.15203985955665436

[training]
max_epochs = 150
batch_size = 254
learning_rate = 0.0004448180444211881
weight_decay = 0.0006160038817920582
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
