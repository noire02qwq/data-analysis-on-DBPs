[model]
type = "RNN"
name = "rnn_regressor"
history_length = 21
units = 96
num_layers = 3
dropout = 0.3184585091501411

[training]
max_epochs = 10
batch_size = 92
learning_rate = 0.008683266792319738
weight_decay = 0.0001497127132074695
patience = 5
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
]
