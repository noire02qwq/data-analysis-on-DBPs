[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 4
learning_rate = 0.1
n_estimators = 100
min_child_weight = 4
subsample = 0.6383667621208338
colsample_bytree = 0.73058905841243
gamma = 0.14113330227337878
reg_lambda = 2.0589786108356862

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.013961216486115332
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
