[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 86
d_model = 166
nhead = 8
num_encoder_layers = 4
dim_feedforward = 577
dropout = 0.17168332126816138

[training]
max_epochs = 150
batch_size = 207
learning_rate = 0.000301824602929778
weight_decay = 0.00010048705233608313
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
