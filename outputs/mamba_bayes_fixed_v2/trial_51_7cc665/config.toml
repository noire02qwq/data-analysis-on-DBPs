[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 154
d_model = 349
n_layers = 10
d_state = 15
d_conv = 5
expand = 4
dropout = 0.2138949446891413

[training]
max_epochs = 150
batch_size = 212
learning_rate = 0.0014646235936391777
weight_decay = 0.0026399545777413326
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
