[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 74
d_model = 69
n_layers = 7
d_state = 40
d_conv = 7
expand = 3
dropout = 0.20576413472991778

[training]
max_epochs = 150
batch_size = 327
learning_rate = 0.001683613851013671
weight_decay = 0.0007385960676292197
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
