[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 43
d_model = 492
n_layers = 2
d_state = 15
d_conv = 5
expand = 3
dropout = 0.2376565364370976

[training]
max_epochs = 150
batch_size = 263
learning_rate = 0.0008005326179832648
weight_decay = 0.002168072617243983
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
