[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 181
d_model = 69
d_state = 60
d_conv = 3
expand = 2
num_layers = 2
dropout = 0.1794090892176921
n_layers = 8

[training]
max_epochs = 150
batch_size = 185
learning_rate = 0.0010924822042913717
weight_decay = 0.00012421089195247098
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
