[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 164
d_model = 391
n_layers = 3
d_state = 14
d_conv = 3
expand = 2
dropout = 0.18506890884489566

[training]
max_epochs = 150
batch_size = 305
learning_rate = 0.0007600890923314024
weight_decay = 0.00015777599705304535
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
