[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 128
d_model = 129
n_layers = 2
d_state = 33
d_conv = 8
expand = 3
dropout = 0.41861047409531865

[training]
max_epochs = 150
batch_size = 180
learning_rate = 0.0005613666865009523
weight_decay = 0.00016925486796379646
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
