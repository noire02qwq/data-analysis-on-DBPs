[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 97
d_model = 85
nhead = 16
num_encoder_layers = 2
dim_feedforward = 516
dropout = 0.1105765364653287

[training]
max_epochs = 150
batch_size = 168
learning_rate = 0.0012292673269387775
weight_decay = 2.2963574685598747e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
