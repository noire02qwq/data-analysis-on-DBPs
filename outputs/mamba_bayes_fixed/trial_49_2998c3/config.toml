[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 88
d_model = 271
d_state = 47
d_conv = 2
expand = 2
num_layers = 2
dropout = 0.4829788923535034
n_layers = 3

[training]
max_epochs = 150
batch_size = 196
learning_rate = 0.0012909129716193386
weight_decay = 0.00026223678501157083
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
