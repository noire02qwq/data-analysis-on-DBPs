[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 5
learning_rate = 0.1
n_estimators = 100
min_child_samples = 67
subsample = 0.7500621268193138
colsample_bytree = 0.8306375872058918
reg_alpha = 0.02650761299246411
reg_lambda = 1.2161092868213033

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.00791281225916255
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
