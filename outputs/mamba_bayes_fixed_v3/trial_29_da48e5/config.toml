[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 125
d_model = 193
n_layers = 11
d_state = 58
d_conv = 3
expand = 2
dropout = 0.2947191154467703

[training]
max_epochs = 150
batch_size = 265
learning_rate = 0.0009108275450590645
weight_decay = 0.001466477186302874
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
