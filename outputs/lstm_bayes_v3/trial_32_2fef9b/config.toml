[model]
type = "LSTM"
name = "lstm_regressor"
history_length = 83
num_layers = 2
units = 175
dropout = 0.20742224874961396
batch_size = 222
learning_rate = 0.0006629960408638049
weight_decay = 0.0005264474723721799

[training]
max_epochs = 100
