[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 5
learning_rate = 0.1
n_estimators = 100
min_child_samples = 67
subsample = 0.7166465027996667
colsample_bytree = 0.7902050131356524
reg_alpha = 0.020260775157446155
reg_lambda = 1.297578679078816

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.008203337673930895
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
