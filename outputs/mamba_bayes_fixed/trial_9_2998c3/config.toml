[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 176
d_model = 414
d_state = 45
d_conv = 5
expand = 4
num_layers = 2
dropout = 0.16570021719940473
n_layers = 4

[training]
max_epochs = 150
batch_size = 132
learning_rate = 0.0006226026831147096
weight_decay = 0.008980501503909505
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
