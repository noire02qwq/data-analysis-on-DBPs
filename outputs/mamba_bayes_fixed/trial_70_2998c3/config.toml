[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 164
d_model = 124
d_state = 56
d_conv = 3
expand = 4
num_layers = 2
dropout = 0.388083234484909
n_layers = 6

[training]
max_epochs = 150
batch_size = 238
learning_rate = 0.0013621168230656254
weight_decay = 0.0001825469430739439
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
