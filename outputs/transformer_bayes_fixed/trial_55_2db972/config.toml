[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 113
d_model = 131
nhead = 4
num_encoder_layers = 5
dim_feedforward = 555
dropout = 0.0973373897666429

[training]
max_epochs = 150
batch_size = 93
learning_rate = 0.00032290636836165203
weight_decay = 0.005420788606063959
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
