[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 172
d_model = 117
d_state = 22
d_conv = 2
expand = 2
num_layers = 2
dropout = 0.12791929864994842
n_layers = 11

[training]
max_epochs = 150
batch_size = 275
learning_rate = 0.0015395712919953842
weight_decay = 0.00031639118700000653
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
