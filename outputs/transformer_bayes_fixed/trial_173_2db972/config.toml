[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 125
d_model = 67
nhead = 4
num_encoder_layers = 3
dim_feedforward = 363
dropout = 0.07672435274516234

[training]
max_epochs = 150
batch_size = 179
learning_rate = 0.00039808064929696015
weight_decay = 0.006511205069620247
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
