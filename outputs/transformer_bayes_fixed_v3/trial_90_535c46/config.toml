[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 88
d_model = 230
nhead = 4
num_encoder_layers = 2
dim_feedforward = 277
dropout = 0.051114029664040744

[training]
max_epochs = 150
batch_size = 225
learning_rate = 0.00012088055919679418
weight_decay = 0.0008526673129563528
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
