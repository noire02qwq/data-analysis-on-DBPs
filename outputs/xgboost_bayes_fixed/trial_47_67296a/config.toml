[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 26
learning_rate = 0.1
n_estimators = 100
min_child_weight = 1
subsample = 0.7482459295388384
colsample_bytree = 0.7661595536330845
gamma = 0.4537720981551549
reg_lambda = 3.058589195852556

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.004410952879515637
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
