[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 187
d_model = 95
d_state = 11
d_conv = 5
expand = 3
num_layers = 2
dropout = 0.2091342534954246
n_layers = 11

[training]
max_epochs = 150
batch_size = 270
learning_rate = 0.0006713034453141534
weight_decay = 0.00032617135630263956
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
