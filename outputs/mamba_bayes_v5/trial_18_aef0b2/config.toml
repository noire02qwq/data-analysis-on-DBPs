[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 192
d_model = 159
n_layers = 7
d_state = 21
d_conv = 3
expand = 4
dropout = 0.27882705328928736

[training]
max_epochs = 150
batch_size = 301
learning_rate = 0.00121245844169147
weight_decay = 0.00023312163560068746
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
