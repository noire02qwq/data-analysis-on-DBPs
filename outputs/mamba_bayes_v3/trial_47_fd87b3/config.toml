[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 185
d_model = 465
n_layers = 7
d_state = 41
d_conv = 5
expand = 3
dropout = 0.1950401478062668
batch_size = 159
learning_rate = 0.0007837331058792482
weight_decay = 0.0002503372881903822

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
