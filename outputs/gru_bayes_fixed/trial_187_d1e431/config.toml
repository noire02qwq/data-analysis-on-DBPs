[model]
type = "GRU"
name = "gru_regressor"
history_length = 88
units = 118
num_layers = 7
dropout = 0.306489893600402

[training]
max_epochs = 150
batch_size = 375
learning_rate = 0.00048291019041022336
weight_decay = 0.0010243313188307878
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
