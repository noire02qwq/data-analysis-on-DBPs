[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 66
d_model = 512
n_layers = 9
d_state = 61
d_conv = 3
expand = 3
dropout = 0.18869500596290795

[training]
max_epochs = 150
batch_size = 302
learning_rate = 0.0011713934073888264
weight_decay = 0.0067309516289148635
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
