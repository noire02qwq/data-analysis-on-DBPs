[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 131
d_model = 68
nhead = 4
num_encoder_layers = 3
dim_feedforward = 353
dropout = 0.07726461631214977

[training]
max_epochs = 150
batch_size = 184
learning_rate = 0.0003949834297514609
weight_decay = 0.006176559041808233
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
