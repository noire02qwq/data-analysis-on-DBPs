[model]
type = "LSTM"
name = "lstm_model"

history_length = 64
units = 128
num_layers = 2
dropout = 0.2

[training]
max_epochs = 10
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 50
seed = 42

[data]
train_csv = "/tmp/train.csv"
val_csv = "/tmp/val.csv"
test_csv = "/tmp/test.csv"
input_columns = ["TRC-DT", "pH-DT"]
output_columns = ["TRC-PPL1"]
