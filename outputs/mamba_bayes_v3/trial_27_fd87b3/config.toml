[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 159
d_model = 482
n_layers = 6
d_state = 17
d_conv = 3
expand = 3
dropout = 0.14273468783911797
batch_size = 143
learning_rate = 0.00075246669307165
weight_decay = 0.0002863528980960376

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
