[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 134
d_model = 204
n_layers = 9
d_state = 41
d_conv = 6
expand = 4
dropout = 0.3689440692143516
batch_size = 134
learning_rate = 0.0005276320867617549
weight_decay = 0.0014462461382744587

[training]
max_epochs = 100
batch_size = 128
