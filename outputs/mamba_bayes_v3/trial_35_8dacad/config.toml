[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 152
d_model = 350
n_layers = 10
d_state = 55
d_conv = 7
expand = 4
dropout = 0.4009018572566582
batch_size = 207
learning_rate = 0.0004672378958688069
weight_decay = 0.004489593296776776

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
