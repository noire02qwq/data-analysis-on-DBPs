[model]
type = "LSTM"
name = "lstm_regressor"
history_length = 123
units = 337
num_layers = 1
dropout = 0.21199830799460861

[training]
max_epochs = 150
batch_size = 346
learning_rate = 0.0003400680770458899
weight_decay = 0.0061861668879943255
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
