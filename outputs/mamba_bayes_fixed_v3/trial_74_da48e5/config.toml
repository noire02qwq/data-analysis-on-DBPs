[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 54
d_model = 496
n_layers = 10
d_state = 22
d_conv = 2
expand = 3
dropout = 0.24973117551984958

[training]
max_epochs = 150
batch_size = 292
learning_rate = 0.0007037553600516338
weight_decay = 0.001032825951935919
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
