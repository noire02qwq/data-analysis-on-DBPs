[model]
type = "CATBOOST"
name = "catboost_regressor"
history_length = 1
depth = 11
learning_rate = 0.1
iterations = 100
l2_leaf_reg = 1.2700105338257004
subsample = 0.948921999400414
random_strength = 0.264953997112324
bagging_temperature = 0.010178639153680934

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.002504175583150226
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
