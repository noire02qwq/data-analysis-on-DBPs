[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 41
d_model = 81
nhead = 16
num_encoder_layers = 6
dim_feedforward = 664
dropout = 0.07869885522039027

[training]
max_epochs = 150
batch_size = 174
learning_rate = 0.0002864310210119148
weight_decay = 0.0023171869002802993
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
