[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 160
d_model = 64
nhead = 4
num_encoder_layers = 3
dim_feedforward = 386
dropout = 0.07620253328688996

[training]
max_epochs = 150
batch_size = 166
learning_rate = 0.00037033094683111843
weight_decay = 0.005427384829548821
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
