[model]
type = "CATBOOST"
name = "catboost_regressor"
history_length = 32
depth = 12
learning_rate = 0.02994209126070358
l2_leaf_reg = 1.065356571175685
subsample = 0.8616567523174841
random_strength = 0.11729977297478231
bagging_temperature = 0.08654051265331912

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
depth = 8
learning_rate = 0.05
l2_leaf_reg = 3.0
subsample = 0.8
random_strength = 1.0
bagging_temperature = 1.0
