[model]
type = "MLP"
name = "mlp_regressor"
hidden_layers = [512, 256, 128]
dropout = 0.1

[training]
max_epochs = 150
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0001
patience = 15
seed = 42

[data]
train_csv = "data/lsww_29c_split/train.csv"
val_csv = "data/lsww_29c_split/val.csv"
test_csv = "data/lsww_29c_split/test.csv"
input_columns = [
    "TRC-DT", "pH-DT", "cond-DT",
    "TRC-RT", "pH-RT", "cond-RT", "fDOM-RT", "DO-RT",
    "TOC-RT", "DOC-RT"
]
output_columns = [
    "TRC-PPL1", "TRC-PPL2",
    "pH-PPL1", "pH-PPL2",
    "cond-PPL1", "cond-PPL2"
]
