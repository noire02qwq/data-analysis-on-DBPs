[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 37
d_model = 67
nhead = 16
num_encoder_layers = 5
dim_feedforward = 689
dropout = 0.06264503582523288

[training]
max_epochs = 150
batch_size = 248
learning_rate = 0.0018338786008828593
weight_decay = 1.4012722413624383e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
