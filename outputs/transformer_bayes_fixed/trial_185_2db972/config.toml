[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 154
d_model = 73
nhead = 8
num_encoder_layers = 4
dim_feedforward = 513
dropout = 0.08358368614766791

[training]
max_epochs = 150
batch_size = 185
learning_rate = 0.0003489091671652065
weight_decay = 0.005032495625335963
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
