[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 132
d_model = 380
n_layers = 4
d_state = 63
d_conv = 4
expand = 4
dropout = 0.16221371289599346

[training]
max_epochs = 150
batch_size = 181
learning_rate = 0.0006916627267194614
weight_decay = 0.001293201664135974
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
