[model]
type = "RNN"
name = "rnn_regressor"
history_length = 22
units = 160
num_layers = 3
dropout = 0.27864098239909985

[training]
max_epochs = 10
batch_size = 133
learning_rate = 0.00011052463777711008
weight_decay = 0.005025912575227564
patience = 5
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
]
