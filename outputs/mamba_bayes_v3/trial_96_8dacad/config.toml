[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 166
d_model = 412
n_layers = 9
d_state = 18
d_conv = 5
expand = 3
dropout = 0.3888072612052837
batch_size = 144
learning_rate = 0.0005881734224188812
weight_decay = 0.006469476118681422

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
