[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 151
d_model = 64
nhead = 4
num_encoder_layers = 6
dim_feedforward = 450
dropout = 0.08741017652571167

[training]
max_epochs = 150
batch_size = 191
learning_rate = 0.0003303810235368182
weight_decay = 0.0031510570962275967
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
