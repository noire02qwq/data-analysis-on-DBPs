[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 5
learning_rate = 0.1
n_estimators = 100
min_child_samples = 52
subsample = 0.7528818555903419
colsample_bytree = 0.7675423049439078
reg_alpha = 0.004652715208419167
reg_lambda = 3.388263464748508

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.010302217185516325
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
