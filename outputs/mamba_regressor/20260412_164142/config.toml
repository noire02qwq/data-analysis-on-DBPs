[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 118
d_model = 217
n_layers = 10
d_state = 17
d_conv = 6
expand = 4
dropout = 0.26965889690203415

[training]
max_epochs = 150
batch_size = 304
learning_rate = 0.0011465035939987151
weight_decay = 0.002796762985548477
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
