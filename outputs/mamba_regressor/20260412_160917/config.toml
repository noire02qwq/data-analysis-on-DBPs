[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 36
d_model = 96
n_layers = 11
d_state = 13
d_conv = 6
expand = 2
dropout = 0.271549411030646

[training]
max_epochs = 150
batch_size = 232
learning_rate = 0.0010522819487905483
weight_decay = 0.00024773336870042423
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
