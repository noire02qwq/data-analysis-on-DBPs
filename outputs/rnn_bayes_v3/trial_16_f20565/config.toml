[model]
type = "RNN"
name = "rnn_regressor"
history_length = 75
units = 65
num_layers = 5
dropout = 0.20120726932388128
batch_size = 141
learning_rate = 0.00020592684186040918
weight_decay = 0.0013549763062170417

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
