[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 140
d_model = 126
nhead = 8
num_encoder_layers = 6
dim_feedforward = 752
dropout = 0.05015883522634843

[training]
max_epochs = 150
batch_size = 101
learning_rate = 0.000471123891275418
weight_decay = 0.0002060058192742907
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
