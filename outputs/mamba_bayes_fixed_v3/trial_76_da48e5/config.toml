[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 40
d_model = 451
n_layers = 2
d_state = 8
d_conv = 3
expand = 3
dropout = 0.20953011632963828

[training]
max_epochs = 150
batch_size = 311
learning_rate = 0.0015730473234501477
weight_decay = 0.00019421527598639666
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
