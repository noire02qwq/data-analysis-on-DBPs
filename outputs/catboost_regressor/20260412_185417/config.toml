[model]
type = "CATBOOST"
name = "catboost_regressor"
depth = 5
learning_rate = 0.05
l2_leaf_reg = 1.386612831359296
subsample = 0.6829684465361786
random_strength = 0.22298652540097194
bagging_temperature = 0.06439087794288592

[training]
max_epochs = 300
batch_size = 256
learning_rate = 0.0038612671095732964
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
