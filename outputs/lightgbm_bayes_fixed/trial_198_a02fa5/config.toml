[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 4
learning_rate = 0.1
n_estimators = 100
min_child_samples = 74
subsample = 0.7641747196720811
colsample_bytree = 0.8416031176933289
reg_alpha = 0.002925524432428526
reg_lambda = 1.6654200062986801

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.009885958634985769
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
