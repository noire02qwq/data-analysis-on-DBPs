[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 182
d_model = 448
d_state = 64
d_conv = 6
expand = 2
num_layers = 2
dropout = 0.3440987162726712
n_layers = 7

[training]
max_epochs = 150
batch_size = 265
learning_rate = 0.0010752508351528104
weight_decay = 0.00019348664946074192
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
