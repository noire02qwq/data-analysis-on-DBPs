[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 95
d_model = 238
nhead = 8
num_encoder_layers = 2
dim_feedforward = 650
dropout = 0.09682009407618555

[training]
max_epochs = 150
batch_size = 123
learning_rate = 0.00018262644627486745
weight_decay = 2.676264499341587e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
