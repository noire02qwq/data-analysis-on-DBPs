[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 43
d_model = 222
nhead = 16
num_encoder_layers = 6
dim_feedforward = 795
dropout = 0.1271629247543357

[training]
max_epochs = 150
batch_size = 150
learning_rate = 0.00021976351240423874
weight_decay = 0.00010274193406005693
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
