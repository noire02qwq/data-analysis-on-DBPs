[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 8
learning_rate = 0.1
n_estimators = 100
min_child_weight = 3
subsample = 0.6424888726568958
colsample_bytree = 0.8359743858776
gamma = 0.006251019099623005
reg_lambda = 3.3671817049029813

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.022985991691886545
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
