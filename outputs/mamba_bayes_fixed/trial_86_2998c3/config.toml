[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 64
d_model = 99
d_state = 25
d_conv = 7
expand = 4
num_layers = 2
dropout = 0.14222015191296758
n_layers = 8

[training]
max_epochs = 150
batch_size = 274
learning_rate = 0.0016662701995549482
weight_decay = 0.0002955116074257409
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
