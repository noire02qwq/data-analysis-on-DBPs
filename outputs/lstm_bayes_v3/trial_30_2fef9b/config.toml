[model]
type = "LSTM"
name = "lstm_regressor"
history_length = 102
num_layers = 2
units = 258
dropout = 0.16517916384809542
batch_size = 325
learning_rate = 0.001413762514411452
weight_decay = 0.003048236523320646

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
