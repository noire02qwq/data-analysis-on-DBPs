[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 182
d_model = 107
n_layers = 6
d_state = 62
d_conv = 6
expand = 3
dropout = 0.27
batch_size = 196
learning_rate = 0.00097
weight_decay = 0.00023

[training]
max_epochs = 150
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
