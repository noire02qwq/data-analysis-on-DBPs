[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 50
d_model = 128
nhead = 4
num_encoder_layers = 3
dim_feedforward = 256
dropout = 0.1

[training]
max_epochs = 150
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0001
patience = 15
seed = 42

[data]
train_csv = "data/lsww_29c_split/train_fixed.csv"
val_csv = "data/lsww_29c_split/val_fixed.csv"
test_csv = "data/lsww_29c_split/test_fixed.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT", "pH-DT", "cond-DT",
    "TRC-RT", "pH-RT", "cond-RT", "fDOM-RT", "DO-RT",
    "TOC-RT", "DOC-RT"
]
output_columns = [
    "TRC-PPL1", "TRC-PPL2",
    "pH-PPL1", "pH-PPL2",
    "cond-PPL1", "cond-PPL2",
    "fDOM-PPL1", "fDOM-PPL2",
    "DO-PPL1", "DO-PPL2",
    "TOC-PPL1", "TOC-PPL2",
    "DOC-PPL1", "DOC-PPL2"
]
