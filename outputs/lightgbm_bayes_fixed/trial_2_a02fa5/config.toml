[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 13
learning_rate = 0.1
n_estimators = 100
min_child_samples = 19
subsample = 0.9389961931401434
colsample_bytree = 0.7281802361216548
reg_alpha = 0.04655236016830654
reg_lambda = 1.6850575701595012

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.00896174271429779
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
