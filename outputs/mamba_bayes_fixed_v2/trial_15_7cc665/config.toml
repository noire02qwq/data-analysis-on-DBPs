[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 67
d_model = 221
n_layers = 12
d_state = 14
d_conv = 4
expand = 2
dropout = 0.4968128962896826

[training]
max_epochs = 150
batch_size = 319
learning_rate = 0.0019321761556328203
weight_decay = 0.00075016309626671
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
