[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 5
learning_rate = 0.1
n_estimators = 100
min_child_weight = 6
subsample = 0.6208772003940833
colsample_bytree = 0.7926846517249941
gamma = 0.0880174553953634
reg_lambda = 1.9111088743862426

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.015490008455395178
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
