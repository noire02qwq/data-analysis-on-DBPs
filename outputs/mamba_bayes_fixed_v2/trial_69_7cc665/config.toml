[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 62
d_model = 359
n_layers = 4
d_state = 10
d_conv = 6
expand = 2
dropout = 0.3895303671242461

[training]
max_epochs = 150
batch_size = 263
learning_rate = 0.0013503872935871708
weight_decay = 0.0015329277175165283
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
