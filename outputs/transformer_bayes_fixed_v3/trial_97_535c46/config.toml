[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 93
d_model = 90
nhead = 4
num_encoder_layers = 4
dim_feedforward = 477
dropout = 0.2815838817541279

[training]
max_epochs = 150
batch_size = 256
learning_rate = 0.00018139510359400715
weight_decay = 0.00048668114450259607
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
