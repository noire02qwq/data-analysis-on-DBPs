[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 154
d_model = 102
d_state = 17
d_conv = 2
expand = 2
num_layers = 2
dropout = 0.12161496304980263
n_layers = 2

[training]
max_epochs = 150
batch_size = 281
learning_rate = 0.001457215893874227
