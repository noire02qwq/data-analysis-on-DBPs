[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 132
d_model = 195
nhead = 8
num_encoder_layers = 5
dim_feedforward = 318
dropout = 0.2399778255954296

[training]
max_epochs = 150
batch_size = 180
learning_rate = 0.00041803049198907573
weight_decay = 0.0005307398406734176
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
