[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 6
learning_rate = 0.1
n_estimators = 100
min_child_weight = 3
subsample = 0.6088042772626945
colsample_bytree = 0.8559482401480901
gamma = 0.006794366963710677
reg_lambda = 2.7103004947144034

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.019607574093145307
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
