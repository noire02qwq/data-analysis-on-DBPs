[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 122
d_model = 403
n_layers = 3
d_state = 31
d_conv = 5
expand = 2
dropout = 0.23823492723278816

[training]
max_epochs = 150
batch_size = 340
learning_rate = 0.0016602500000887064
weight_decay = 0.00019459056958684423
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
