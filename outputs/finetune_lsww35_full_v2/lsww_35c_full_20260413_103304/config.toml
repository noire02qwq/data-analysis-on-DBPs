[model]
input_dim = 8
output_dim = 10
d_model = 256
nhead = 8
num_encoder_layers = 2
dim_feedforward = 509
dropout = 0.277

[training]
method = "full"
learning_rate = 0.0001
max_epochs = 50
patience = 10
batch_size = 64
seed = 42

[data]
dataset = "lsww_35c"
train_csv = "data/lsww_35c_split/train.csv"
val_csv = "data/lsww_35c_split/val.csv"
test_csv = "data/lsww_35c_split/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
    "DOC-PPL1",
    "DOC-PPL2",
]

[pretrained]
original_model_path = "outputs/caww29_unified/final_models/transformer/best_model.pt"
