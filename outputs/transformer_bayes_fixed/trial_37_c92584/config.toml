[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 105
d_model = 153
nhead = 4
num_encoder_layers = 2
dim_feedforward = 621
dropout = 0.14322538505958046

[training]
max_epochs = 150
batch_size = 145
learning_rate = 0.00264975338692778
weight_decay = 0.000942660242090761
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
