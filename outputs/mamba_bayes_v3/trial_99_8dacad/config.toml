[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 128
d_model = 459
n_layers = 10
d_state = 34
d_conv = 4
expand = 2
dropout = 0.339028060913874
batch_size = 223
learning_rate = 0.0005174524204574181
weight_decay = 0.00015268151544048245

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
