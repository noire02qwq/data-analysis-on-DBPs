[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 60
d_model = 64
nhead = 4
num_encoder_layers = 6
dim_feedforward = 458
dropout = 0.1278877947955222

[training]
max_epochs = 150
batch_size = 199
learning_rate = 0.0004808057256571352
weight_decay = 0.00880954906604337
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
