[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 42
d_model = 112
nhead = 16
num_encoder_layers = 2
dim_feedforward = 643
dropout = 0.13505258213396154

[training]
max_epochs = 150
batch_size = 186
learning_rate = 0.0019906406201195023
weight_decay = 0.004159834613462265
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
