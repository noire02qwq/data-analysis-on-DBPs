[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 183
d_model = 434
d_state = 60
d_conv = 6
expand = 2
num_layers = 2
dropout = 0.2674665212852175
n_layers = 9

[training]
max_epochs = 150
batch_size = 283
learning_rate = 0.0015339617163312295
weight_decay = 0.00020659314478116317
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
