[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 190
d_model = 442
n_layers = 8
d_state = 61
d_conv = 8
expand = 4
dropout = 0.1784980870377059

[training]
max_epochs = 150
batch_size = 215
learning_rate = 0.0019544106716782783
weight_decay = 0.0014949771330159845
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
