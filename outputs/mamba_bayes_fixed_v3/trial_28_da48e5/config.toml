[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 142
d_model = 401
n_layers = 12
d_state = 23
d_conv = 4
expand = 2
dropout = 0.4175581103207055

[training]
max_epochs = 150
batch_size = 356
learning_rate = 0.0010717745397872726
weight_decay = 0.0001532032503600231
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
