[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 19
learning_rate = 0.1
n_estimators = 100
min_child_weight = 10
subsample = 0.6976325327596266
colsample_bytree = 0.7757665040484826
gamma = 0.008957271846398374
reg_lambda = 3.2524429040038227

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.02902507008137238
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
