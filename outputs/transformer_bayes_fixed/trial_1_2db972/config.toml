[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 65
d_model = 115
nhead = 8
num_encoder_layers = 5
dim_feedforward = 863
dropout = 0.07409883667028128

[training]
max_epochs = 150
batch_size = 154
learning_rate = 0.0005013185404695783
weight_decay = 0.0008193072150861305
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
