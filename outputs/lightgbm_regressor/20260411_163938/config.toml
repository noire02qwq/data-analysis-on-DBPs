[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
colsample_bytree = 0.81
learning_rate = 0.006
max_depth = 4
min_child_samples = 69
reg_alpha = 0.0016
reg_lambda = 2.25
subsample = 0.78

[training]
max_epochs = 150
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
