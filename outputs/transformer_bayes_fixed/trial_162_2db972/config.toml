[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 149
d_model = 64
nhead = 4
num_encoder_layers = 6
dim_feedforward = 436
dropout = 0.08209961833979502

[training]
max_epochs = 150
batch_size = 196
learning_rate = 0.0002710438998890441
weight_decay = 0.004141746281863785
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
