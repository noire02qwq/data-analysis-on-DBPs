[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 82
d_model = 469
d_state = 22
d_conv = 2
expand = 4
num_layers = 2
dropout = 0.20284816531416092
n_layers = 8

[training]
max_epochs = 150
batch_size = 322
learning_rate = 0.0007155315719321649
weight_decay = 0.007917582607328147
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
