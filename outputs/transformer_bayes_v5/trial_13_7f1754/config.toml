[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 95
d_model = 253
nhead = 8
num_encoder_layers = 3
dim_feedforward = 633
dropout = 0.22411391879832607

[training]
max_epochs = 150
batch_size = 211
learning_rate = 0.0007228190831803135
weight_decay = 5.137071512348476e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
