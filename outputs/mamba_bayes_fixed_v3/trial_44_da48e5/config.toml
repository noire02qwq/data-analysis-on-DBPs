[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 150
d_model = 355
n_layers = 9
d_state = 62
d_conv = 5
expand = 3
dropout = 0.2381382163878737

[training]
max_epochs = 150
batch_size = 285
learning_rate = 0.0018418157821763611
weight_decay = 0.0011111140899702982
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
