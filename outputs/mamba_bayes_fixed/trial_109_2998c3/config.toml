[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 189
d_model = 434
d_state = 11
d_conv = 5
expand = 2
num_layers = 2
dropout = 0.277639993812847
n_layers = 4

[training]
max_epochs = 150
batch_size = 299
learning_rate = 0.001319641270800353
weight_decay = 0.00020514271650268431
