[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 174
d_model = 302
n_layers = 6
d_state = 15
d_conv = 3
expand = 4
dropout = 0.25586960721411794

[training]
max_epochs = 150
batch_size = 180
learning_rate = 0.0007504826457203578
weight_decay = 0.00025271092835952213
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
