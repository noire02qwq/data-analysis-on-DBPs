[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 171
d_model = 340
n_layers = 10
d_state = 64
d_conv = 6
expand = 3
dropout = 0.3713746774585289
batch_size = 159
learning_rate = 0.00040596532090295747
weight_decay = 0.004266699649333683

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
