[model]
type = "RNN"
name = "rnn_regressor"
history_length = 58
units = 213
num_layers = 3
dropout = 0.27837131854860864

[training]
max_epochs = 10
batch_size = 185
learning_rate = 0.0010647073492046828
weight_decay = 0.0014656559697309088
patience = 5
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
]
