[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 136
d_model = 185
d_state = 45
d_conv = 3
expand = 3
num_layers = 2
dropout = 0.16276938845630057
n_layers = 4

[training]
max_epochs = 150
batch_size = 215
learning_rate = 0.0015613176741489005
weight_decay = 0.000162805912593283
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
