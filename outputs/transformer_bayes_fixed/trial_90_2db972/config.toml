[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 53
d_model = 85
nhead = 4
num_encoder_layers = 6
dim_feedforward = 437
dropout = 0.11055462727626275

[training]
max_epochs = 150
batch_size = 159
learning_rate = 0.00016394652966676072
weight_decay = 8.230857687427812e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
