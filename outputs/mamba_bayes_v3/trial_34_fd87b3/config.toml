[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 180
d_model = 482
n_layers = 5
d_state = 22
d_conv = 4
expand = 2
dropout = 0.1701611427053158
batch_size = 169
learning_rate = 0.0007100441065316568
weight_decay = 0.0003674702922225434

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
