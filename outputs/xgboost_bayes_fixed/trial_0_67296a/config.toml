[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 25
learning_rate = 0.1
n_estimators = 100
min_child_weight = 10
subsample = 0.7384494197385233
colsample_bytree = 0.6202459117442001
gamma = 1.7120619632409997
reg_lambda = 1.459794532075018

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0026708471302597974
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
