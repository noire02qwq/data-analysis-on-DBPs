[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 5
learning_rate = 0.1
n_estimators = 100
min_child_weight = 4
subsample = 0.6373404409852872
colsample_bytree = 0.7294507715724743
gamma = 0.08309023815205069
reg_lambda = 1.9225496693374786

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.014633002748245395
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
