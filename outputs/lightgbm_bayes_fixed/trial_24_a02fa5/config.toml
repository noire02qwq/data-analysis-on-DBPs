[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 24
learning_rate = 0.1
n_estimators = 100
min_child_samples = 43
subsample = 0.784871959590122
colsample_bytree = 0.6669662430265343
reg_alpha = 0.005190858457957543
reg_lambda = 1.1400472124491974

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.01132670903354286
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
