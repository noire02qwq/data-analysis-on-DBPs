[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 7
learning_rate = 0.1
n_estimators = 100
min_child_samples = 11
subsample = 0.7600140041369104
colsample_bytree = 0.7749334556550957
reg_alpha = 0.008890952757564144
reg_lambda = 2.656686184274295

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.010746778623855415
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
