[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 192
d_model = 96
d_state = 12
d_conv = 5
expand = 3
num_layers = 2
dropout = 0.31749803223669637
n_layers = 5

[training]
max_epochs = 150
batch_size = 222
learning_rate = 0.00151589581831078
weight_decay = 0.0001102885607247444
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
