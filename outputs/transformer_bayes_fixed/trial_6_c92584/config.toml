[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 78
d_model = 162
nhead = 4
num_encoder_layers = 2
dim_feedforward = 346
dropout = 0.16461812089912178

[training]
max_epochs = 150
batch_size = 125
learning_rate = 0.0002546852864278574
weight_decay = 0.0010214653376690863
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
