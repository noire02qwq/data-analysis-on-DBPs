[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 117
d_model = 485
n_layers = 11
d_state = 57
d_conv = 4
expand = 2
dropout = 0.446964845247722

[training]
max_epochs = 150
batch_size = 209
learning_rate = 0.0014951761927495936
weight_decay = 0.00023494677250170015
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
