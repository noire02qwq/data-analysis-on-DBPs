[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 6
learning_rate = 0.1
n_estimators = 100
min_child_weight = 5
subsample = 0.622938102457756
colsample_bytree = 0.7303068098134592
gamma = 0.14648161206145643
reg_lambda = 1.5913194552351932

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.01267807088009794
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
