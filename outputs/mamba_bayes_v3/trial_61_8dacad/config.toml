[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 179
d_model = 443
n_layers = 11
d_state = 54
d_conv = 5
expand = 3
dropout = 0.4178673654192249
batch_size = 139
learning_rate = 0.0016463685080401894
weight_decay = 0.003342403514353364

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
