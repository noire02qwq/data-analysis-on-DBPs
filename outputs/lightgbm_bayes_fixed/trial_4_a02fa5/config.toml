[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 9
learning_rate = 0.1
n_estimators = 100
min_child_samples = 71
subsample = 0.7685120651043112
colsample_bytree = 0.8236405993599849
reg_alpha = 0.0013693922724348126
reg_lambda = 0.6921809606680375

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.004185661660197595
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
