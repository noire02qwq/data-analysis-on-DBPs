[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 172
d_model = 387
d_state = 34
d_conv = 3
expand = 3
num_layers = 2
dropout = 0.1372955391667924
n_layers = 6

[training]
max_epochs = 150
batch_size = 296
learning_rate = 0.0016127255647226356
weight_decay = 0.0010172170161884128
