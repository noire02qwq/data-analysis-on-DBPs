[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 120
d_model = 91
nhead = 4
num_encoder_layers = 3
dim_feedforward = 611
dropout = 0.1646128393656591

[training]
max_epochs = 150
batch_size = 65
learning_rate = 0.0006974736062510936
weight_decay = 0.003110290321361591
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
