[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 21
learning_rate = 0.1
n_estimators = 100
min_child_weight = 6
subsample = 0.6480981320182311
colsample_bytree = 0.7471853963089385
gamma = 0.021622619088892098
reg_lambda = 3.797832784236983

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0032869813999247596
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
