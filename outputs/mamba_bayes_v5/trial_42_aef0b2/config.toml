[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 102
d_model = 279
n_layers = 5
d_state = 15
d_conv = 4
expand = 2
dropout = 0.32162905203939374

[training]
max_epochs = 150
batch_size = 368
learning_rate = 0.0013300263494806434
weight_decay = 0.00015538602596843788
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
