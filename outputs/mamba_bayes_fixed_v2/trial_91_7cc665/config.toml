[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 183
d_model = 497
n_layers = 7
d_state = 41
d_conv = 7
expand = 3
dropout = 0.20207710893318206

[training]
max_epochs = 150
batch_size = 342
learning_rate = 0.0004527936714882614
