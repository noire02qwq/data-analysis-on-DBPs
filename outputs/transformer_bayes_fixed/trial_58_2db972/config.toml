[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 51
d_model = 118
nhead = 4
num_encoder_layers = 5
dim_feedforward = 518
dropout = 0.14214725512738854

[training]
max_epochs = 150
batch_size = 203
learning_rate = 0.0005322614758243072
weight_decay = 0.001949575554244195
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
