[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 75
d_model = 171
nhead = 4
num_encoder_layers = 6
dim_feedforward = 1005
dropout = 0.17245033696185624

[training]
max_epochs = 150
batch_size = 202
learning_rate = 0.0001392051518229688
weight_decay = 0.0018764818430918012
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
