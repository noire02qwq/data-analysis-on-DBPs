[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 58
d_model = 149
n_layers = 5
d_state = 57
d_conv = 6
expand = 3
dropout = 0.4669321275010637

[training]
max_epochs = 150
batch_size = 284
learning_rate = 0.0012059071324006538
weight_decay = 0.007064796571438577
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
