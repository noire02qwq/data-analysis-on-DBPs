[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 131
d_model = 172
n_layers = 6
d_state = 21
d_conv = 4
expand = 2
dropout = 0.3408751894964101

[training]
max_epochs = 150
batch_size = 334
learning_rate = 0.0009026446279248257
weight_decay = 0.00032278627931322287
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
