[model]
type = "XGBOOST"
name = "xgboost_regressor"
history_length = 1
max_depth = 22
learning_rate = 0.1
n_estimators = 100
min_child_weight = 5
subsample = 0.6188082674621161
colsample_bytree = 0.872342857687576
gamma = 0.13216803364595633
reg_lambda = 1.8015261014638861

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.007406374394653264
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
