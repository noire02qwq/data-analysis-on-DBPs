[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 184
d_model = 154
n_layers = 4
d_state = 62
d_conv = 6
expand = 4
dropout = 0.34393144135042847

[training]
max_epochs = 150
batch_size = 320
learning_rate = 0.0014259373679871325
weight_decay = 0.00535010078977588
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
