[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 129
d_model = 425
d_state = 46
d_conv = 6
expand = 2
num_layers = 2
dropout = 0.24124152721666056
n_layers = 7

[training]
max_epochs = 150
batch_size = 258
learning_rate = 0.0011748008759311411
weight_decay = 0.0002629825269385097
