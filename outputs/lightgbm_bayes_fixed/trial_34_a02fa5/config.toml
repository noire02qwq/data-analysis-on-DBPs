[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 11
learning_rate = 0.1
n_estimators = 100
min_child_samples = 85
subsample = 0.7016520349737465
colsample_bytree = 0.8667056585851779
reg_alpha = 0.28362175609791224
reg_lambda = 1.452166457758118

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.0049548199887224555
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
