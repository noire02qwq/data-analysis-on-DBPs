[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 188
d_model = 221
d_state = 14
d_conv = 2
expand = 4
num_layers = 2
dropout = 0.1756148188249364
n_layers = 6

[training]
max_epochs = 150
batch_size = 301
learning_rate = 0.0013364678070864697
weight_decay = 0.0006105056119547493
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
