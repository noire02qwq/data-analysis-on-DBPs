[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 182
d_model = 215
d_state = 16
d_conv = 2
expand = 4
num_layers = 2
dropout = 0.22132246499243025
n_layers = 5

[training]
max_epochs = 150
batch_size = 298
learning_rate = 0.0011079582319115154
weight_decay = 0.000822078250821476
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
