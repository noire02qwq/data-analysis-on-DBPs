[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 128
d_model = 99
nhead = 8
num_encoder_layers = 3
dim_feedforward = 372
dropout = 0.09982074803017915

[training]
max_epochs = 150
batch_size = 235
learning_rate = 0.00012379761622478757
weight_decay = 2.2570507037737943e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
