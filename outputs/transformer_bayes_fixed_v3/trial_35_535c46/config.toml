[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 57
d_model = 197
nhead = 4
num_encoder_layers = 4
dim_feedforward = 557
dropout = 0.05818830892118605

[training]
max_epochs = 150
batch_size = 158
learning_rate = 0.0012421567272158666
weight_decay = 0.00034124076053165613
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
