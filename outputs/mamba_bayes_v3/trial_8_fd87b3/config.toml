[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 143
d_model = 270
n_layers = 4
d_state = 56
d_conv = 5
expand = 2
dropout = 0.29195949573379826
batch_size = 313
learning_rate = 0.0018280837089216298
weight_decay = 0.0009292536504114453

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
]
