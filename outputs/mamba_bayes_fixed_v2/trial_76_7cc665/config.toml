[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 102
d_model = 438
n_layers = 6
d_state = 58
d_conv = 3
expand = 3
dropout = 0.1948340923205252

[training]
max_epochs = 150
batch_size = 144
learning_rate = 0.0008201035795328347
weight_decay = 0.0048238253650632395
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
