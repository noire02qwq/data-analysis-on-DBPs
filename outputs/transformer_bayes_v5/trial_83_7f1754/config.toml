[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 153
d_model = 237
nhead = 4
num_encoder_layers = 2
dim_feedforward = 805
dropout = 0.10857250920982965

[training]
max_epochs = 150
batch_size = 175
learning_rate = 0.0001449715711016423
weight_decay = 2.724707910796125e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
