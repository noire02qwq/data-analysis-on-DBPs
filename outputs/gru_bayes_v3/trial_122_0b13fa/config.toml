[model]
type = "GRU"
name = "gru_regressor"
history_length = 32
units = 330
num_layers = 2
dropout = 0.2580319639834544
batch_size = 377
learning_rate = 0.00111033437271604
weight_decay = 0.008882681158464037

[training]
max_epochs = 10
batch_size = 128
learning_rate = 0.001
weight_decay = 0.0
patience = 5
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
]
