[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 62
d_model = 143
d_state = 55
d_conv = 2
expand = 2
num_layers = 2
dropout = 0.38443975087743093
n_layers = 6

[training]
max_epochs = 150
batch_size = 248
learning_rate = 0.0015826103835179875
weight_decay = 0.00032088609760790585
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
