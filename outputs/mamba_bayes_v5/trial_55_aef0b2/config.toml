[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 126
d_model = 512
n_layers = 5
d_state = 17
d_conv = 5
expand = 2
dropout = 0.29445298140017523

[training]
max_epochs = 150
batch_size = 343
learning_rate = 0.0013655763666703363
weight_decay = 0.0001380904211803322
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
