[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 52
d_model = 444
d_state = 58
d_conv = 4
expand = 2
num_layers = 2
dropout = 0.12784517643419652
n_layers = 5

[training]
max_epochs = 150
batch_size = 248
learning_rate = 0.0008521996703405772
weight_decay = 0.0003053461644902252
