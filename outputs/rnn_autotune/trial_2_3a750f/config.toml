[model]
type = "RNN"
name = "rnn_regressor"
history_length = 34
units = 204
num_layers = 1
dropout = 0.2786817340566754

[training]
max_epochs = 10
batch_size = 177
learning_rate = 0.0004949864209805422
weight_decay = 0.001657034214927829
patience = 5
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "minutes_since_start",
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
]
