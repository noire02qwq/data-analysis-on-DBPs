[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 136
d_model = 469
n_layers = 3
d_state = 58
d_conv = 5
expand = 4
dropout = 0.250226494184112

[training]
max_epochs = 150
batch_size = 342
learning_rate = 0.0019511304469478448
weight_decay = 0.004360246248443175
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
