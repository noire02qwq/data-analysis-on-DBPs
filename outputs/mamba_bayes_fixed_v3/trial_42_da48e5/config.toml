[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 178
d_model = 507
n_layers = 11
d_state = 53
d_conv = 8
expand = 3
dropout = 0.15928789104124122

[training]
max_epochs = 150
batch_size = 243
learning_rate = 0.0013958515384015662
weight_decay = 0.006699486981707019
