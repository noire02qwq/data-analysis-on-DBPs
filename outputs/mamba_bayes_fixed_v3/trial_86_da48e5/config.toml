[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 98
d_model = 196
n_layers = 8
d_state = 28
d_conv = 4
expand = 2
dropout = 0.2691949718219683

[training]
max_epochs = 150
batch_size = 333
learning_rate = 0.0008718677538465806
weight_decay = 0.004430148005184069
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
