[model]
type = "MLP"
name = "mlp_regressor"
history_length = 1
hidden_layers = [
    512,
    256,
    128,
]
dropout = 0.20536164429689222
mid_layer_count = 5
mid_layer_size = 207

[training]
max_epochs = 150
batch_size = 107
learning_rate = 0.0010244053207551242
weight_decay = 5.4509557731867034e-05
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
