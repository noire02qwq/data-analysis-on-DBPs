[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 45
d_model = 248
d_state = 29
d_conv = 2
expand = 2
num_layers = 2
dropout = 0.17854459259144329
n_layers = 12

[training]
max_epochs = 150
batch_size = 293
learning_rate = 0.0014743902944715042
weight_decay = 0.0004705551175508051
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
