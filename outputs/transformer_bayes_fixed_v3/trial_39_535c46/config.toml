[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 42
d_model = 149
nhead = 16
num_encoder_layers = 5
dim_feedforward = 619
dropout = 0.2714149390659305

[training]
max_epochs = 150
batch_size = 202
learning_rate = 0.002566609377799779
weight_decay = 0.0004453893865432411
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
