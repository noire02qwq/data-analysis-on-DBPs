[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 33
d_model = 108
nhead = 4
num_encoder_layers = 6
dim_feedforward = 551
dropout = 0.23145391077470043

[training]
max_epochs = 150
batch_size = 191
learning_rate = 0.0008348128470381827
weight_decay = 0.0032907180740782455
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
