[model]
type = "LIGHTGBM"
name = "lightgbm_regressor"
history_length = 1
num_leaves = 31
max_depth = 5
learning_rate = 0.1
n_estimators = 100
min_child_samples = 70
subsample = 0.7559190679699151
colsample_bytree = 0.8134610253148743
reg_alpha = 0.013605630711008506
reg_lambda = 1.3983537392673915

[training]
max_epochs = 100
batch_size = 128
learning_rate = 0.006794172940558525
weight_decay = 0.0
patience = 10
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL2",
]
