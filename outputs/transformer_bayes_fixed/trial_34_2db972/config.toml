[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 37
d_model = 99
nhead = 8
num_encoder_layers = 2
dim_feedforward = 938
dropout = 0.12798319194785515

[training]
max_epochs = 150
batch_size = 255
learning_rate = 0.0007542912940577689
weight_decay = 0.007315523522780233
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
