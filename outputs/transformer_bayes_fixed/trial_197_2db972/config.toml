[model]
type = "TRANSFORMER"
name = "transformer_regressor"
history_length = 34
d_model = 78
nhead = 4
num_encoder_layers = 4
dim_feedforward = 466
dropout = 0.07393682134669811

[training]
max_epochs = 150
batch_size = 138
learning_rate = 0.002526751712365448
weight_decay = 0.0036825141086266164
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
