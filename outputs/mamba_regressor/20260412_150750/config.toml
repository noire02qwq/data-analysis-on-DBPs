[model]
type = "MAMBA"
name = "mamba_regressor"
history_length = 61
d_model = 340
n_layers = 10
d_state = 36
d_conv = 3
expand = 4
dropout = 0.2920256753214239

[training]
max_epochs = 150
batch_size = 142
learning_rate = 0.0011221035482695623
weight_decay = 0.0003192798683675356
patience = 15
seed = 42

[data]
train_csv = "data/train.csv"
val_csv = "data/val.csv"
test_csv = "data/test.csv"
input_columns = [
    "TRC-DT",
    "pH-DT",
    "cond-DT",
    "TRC-RT",
    "pH-RT",
    "cond-RT",
    "fDOM-RT",
    "DO-RT",
    "TOC-RT",
    "DOC-RT",
]
output_columns = [
    "TRC-PPL1",
    "TRC-PPL2",
    "pH-PPL1",
    "pH-PPL2",
    "cond-PPL1",
    "cond-PPL2",
    "TOC-PPL1",
    "TOC-PPL2",
]
